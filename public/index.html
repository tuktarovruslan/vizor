<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizor · архитектура</title>
<style>
  :root {
    --bg: #0d1016; --panel: rgba(22, 27, 36, .92); --text: #e6e9ef; --muted: #8b95a7; --border: #2b3240;
    --ok: #3ecf7d; --bad: #f0605d; --accent: #4f8cff; --recent: #ffe066;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           backdrop-filter: blur(6px); z-index: 10; }
  #top { top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px 14px; padding: 8px 12px; flex-wrap: wrap; }
  #top h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .group .cap { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .chip { padding: 4px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button, .seg a { padding: 4px 12px; border: 0; background: transparent; text-decoration: none; color: inherit; }
  .seg button[aria-pressed="true"], .seg a[aria-current="page"] { background: var(--accent); color: #fff; }
  .seg a:not([aria-current]):hover { background: rgba(79, 140, 255, .15); }
  .layer { padding: 4px 10px 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: transparent; display: inline-flex; gap: 7px; align-items: center; opacity: .55; }
  .layer .box { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--c); display: grid; place-items: center; font-size: 10px; line-height: 1; color: #0d1016; }
  .layer[aria-pressed="true"] { opacity: 1; border-color: var(--c); }
  .layer[aria-pressed="true"] .box { background: var(--c); }
  .layer[aria-pressed="true"] .box::after { content: "✓"; font-weight: 700; }
  .layer .n { color: var(--muted); font-size: 12px; }
  #top .meta { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #top .meta a { color: var(--text); }
  #home, #resetLayout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; }
  #resetLayout:disabled { opacity: .4; cursor: default; }

  /* нижние элементы одной высоты BOTTOM_H = 40 px: шестерёнка, свёрнутая «Как читать схему», шапка «Недавно изменено» */
  #legend { left: 60px; bottom: 12px; padding: 10px 14px; font-size: 12px; max-width: 300px; min-height: 40px; }
  #legend h2, #recent h2 { font-size: 12px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #legend ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
  #legend li { display: flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .ln { width: 18px; height: 3px; border-radius: 2px; flex: none; }
  .ln.dash { background: repeating-linear-gradient(90deg, #c0c8d8 0 4px, transparent 4px 7px) !important; }
  #legend .hint { color: var(--muted); margin: 6px 0 0; }
  #legend summary { cursor: pointer; color: var(--muted); }

  #recent { right: 12px; bottom: 12px; padding: 0; font-size: 12px; width: 260px; overflow: hidden; }
  /* шапка-кнопка сворачивает список: тело схлопывается по высоте, окно остаётся прижатым к низу */
  #recent .head { width: 100%; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: none; border: 0; text-align: left; }
  #recent .head .ttl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #recent .head .count { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 600; min-width: 18px; text-align: center;
                         padding: 1px 6px; border-radius: 8px; border: 1px solid var(--border); }
  #recent .head .count.has { color: var(--recent); border-color: var(--recent); }
  #recent .head svg { flex: none; color: var(--muted); transition: transform .3s ease; }
  #recent .head:hover svg { color: var(--text); }
  #recent.collapsed .head svg { transform: rotate(180deg); }
  #recent .body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
  #recent.collapsed .body { grid-template-rows: 0fr; }
  #recent .body > div { min-height: 0; overflow: hidden; }
  #recent ul { list-style: none; margin: 0; padding: 0 14px 10px; max-height: calc(40vh - 40px); overflow: auto; }
  #recent li button { width: 100%; text-align: left; background: none; border: 0; padding: 3px 0; display: flex; gap: 8px; }
  #recent li button:hover .name { color: var(--recent); }
  #recent .ago { color: var(--muted); margin-left: auto; white-space: nowrap; }
  #recent .empty { color: var(--muted); }

  .card .kind { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .card dt { color: var(--muted); } .card dd { margin: 0; overflow-wrap: anywhere; }
  .card h4 { margin: 12px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li button { background: none; border: 0; padding: 2px 0; text-align: left; display: flex; gap: 8px; align-items: center; }
  .card li button:hover { color: var(--recent); }
  .card .rel { color: var(--muted); font-size: 11px; }
  .card ul.api li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; font-size: 13px; }
  .card ul.api a, .card .doc a { color: #9cc0ff; font-weight: 600; }
  .card .doc { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .card p.rel { margin: 0; }
  .method { font: 700 11px/1 ui-monospace, Consolas, monospace; padding: 4px 6px; border-radius: 5px; color: #0d1016; background: #9aa3b2; flex: none; margin-top: 1px; }
  .m-get { background: #61affe; } .m-post { background: #49cc90; } .m-put { background: #fca130; } .m-patch { background: #50e3c2; } .m-delete { background: #f93e3e; }

  /* карточки связей «запрос к API» и блоков: висят в пространстве схемы рядом с ней, тащатся за шапку, открыто до пяти каждого вида */
  #cards { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .card { position: absolute; left: 0; top: 0; width: 440px; transform-origin: 0 0; pointer-events: auto; display: flex; flex-direction: column;
          background: var(--panel); border: 1px solid var(--border); border-radius: 12px; backdrop-filter: blur(6px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: border-color .2s, box-shadow .2s; }
  .card.hl { border-color: #ffd166; box-shadow: 0 0 0 1px #ffd166, 0 10px 30px rgba(0, 0, 0, .45); }
  .card.flash { animation: flash .9s ease 2; }
  @keyframes flash { 50% { border-color: #ffd166; box-shadow: 0 0 0 3px rgba(255, 209, 102, .55), 0 10px 30px rgba(0, 0, 0, .45); } }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; cursor: grab; user-select: none; touch-action: none;
               border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; background: rgba(255, 209, 102, .06); }
  .card.dragging .card-head { cursor: grabbing; }
  .card-head .no { font: 700 11px/1 ui-monospace, Consolas, monospace; color: #0d1016; background: #ffd166; border-radius: 5px; padding: 3px 6px; }
  .card-head b { font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-head .grip { color: var(--muted); font-size: 14px; }
  .card-head .size { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; cursor: default; }
  .card-head .size input { width: 72px; accent-color: #ffd166; cursor: pointer; margin: 0; }
  .card-head .size output { font: 11px ui-monospace, Consolas, monospace; min-width: 32px; text-align: right; }
  .card-head .close { background: none; border: 0; font-size: 18px; line-height: 1; color: var(--muted); padding: 0 4px; }
  .card-head .close:hover { color: var(--text); }
  .card-body { padding: 10px 16px 14px; max-height: min(62vh, 640px); overflow: auto; overscroll-behavior: contain; }
  .card-node { width: 340px; }
  .card-service { width: 340px; }
  .card .facts { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .card .svc-state { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 600; }
  .card .svc-state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .card .svc-state.up .dot { background: var(--ok); } .card .svc-state.down .dot { background: var(--bad); }
  .card .svc-state.down { color: var(--bad); }
  .card ul.floors li, .card-service ul li { display: flex; gap: 8px; align-items: center; padding: 2px 0; font-size: 13px; }
  .card ul.floors .rel { margin-left: auto; }
  .card ul.routes .method { margin-top: 0; margin-right: 4px; }
  .card ul.routes code { font: 12px ui-monospace, Consolas, monospace; }
  .card .recent-note { color: var(--recent); margin-top: 4px; }
  .card-node .card-head { background: rgba(255, 255, 255, .03); }
  #toast { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); padding: 8px 14px; font-size: 13px; z-index: 20;
           opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #closeCards { background: none; border: 1px solid #ffd166; color: #ffd166; border-radius: 8px; padding: 3px 10px; }
  .card .ends { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 4px 0 10px; font-size: 13px; }
  .card .ends > span { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); overflow-wrap: anywhere; }
  .card .ends > span small { display: block; color: var(--muted); font-size: 11px; }
  .card .ends button { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; }
  .card .ends button:hover { color: var(--recent); }
  .card .ends .arrows { color: var(--muted); font-size: 15px; line-height: 1.1; text-align: center; border: 0; padding: 0; }
  .card .ends .arrows .q { color: #ffd166; } .card .ends .arrows .a { color: #5ee0a0; }
  .card .op { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 4px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .card .op a { color: #9cc0ff; font-weight: 600; white-space: nowrap; margin-left: auto; }
  .card .dir { border-left: 3px solid var(--c); padding: 2px 0 2px 10px; margin: 8px 0; }
  .card .dir > h4 { margin-top: 2px; color: var(--c); }
  .card .dir .ct { color: var(--muted); font-size: 11px; margin: 0 0 4px; }
  .card table.fields { width: 100%; border-collapse: collapse; font-size: 12px; margin: 2px 0 4px; }
  .card table.fields td { padding: 4px 6px 4px 0; vertical-align: top; border-top: 1px solid rgba(43, 50, 64, .7); }
  .card .dir code { font: 11.5px ui-monospace, Consolas, monospace; color: var(--text); }
  .card table.fields code { font: 600 12px ui-monospace, Consolas, monospace; color: var(--text); }
  .card table.fields .rq { color: var(--bad); margin-left: 2px; font-weight: 700; }
  .card table.fields .d, .card table.fields .c { color: var(--muted); font-size: 11px; }
  .card table.fields td.t { white-space: nowrap; text-align: right; font: 12px ui-monospace, Consolas, monospace; color: #9cc0ff; }
  .card table.fields td.t .c { font-family: inherit; }
  .card .status { font: 700 11px/1 ui-monospace, Consolas, monospace; padding: 3px 6px; border-radius: 5px; color: #0d1016; background: #9aa3b2; }
  .card .status.s2 { background: #5ee0a0; } .card .status.s4 { background: #fca130; } .card .status.s5 { background: #f0605d; }
  .card details.resp { margin: 6px 0; }
  .card details.resp > summary { cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px; list-style: none; }
  .card details.resp > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .2s; }
  .card details.resp[open] > summary::before { transform: rotate(90deg); }
  .card details.resp > div { padding: 4px 0 0 18px; }
  .card details.ex > summary { cursor: pointer; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .card pre { margin: 4px 0 0; padding: 8px; border-radius: 8px; background: rgba(0, 0, 0, .3); border: 1px solid var(--border);
              font: 11.5px/1.45 ui-monospace, Consolas, monospace; overflow: auto; max-height: 220px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card li .linkbtn { margin-left: auto; flex: none; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 11px; color: #9cc0ff; }
  .card li .linkbtn:hover { border-color: #9cc0ff; color: #9cc0ff; }
  .card ul li:has(.linkbtn) { display: flex; align-items: center; gap: 6px; }

  /* подписи в сцене */
  .lbl { font-size: 11px; color: #cfd6e2; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 2px #000; padding-top: 4px; transition: opacity .3s ease; }
  .lbl.recent { color: var(--recent); font-weight: 600; }
  .lbl.hl { color: #fff; font-weight: 600; font-size: 12px; }
  .cl { overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #9fb0c9; white-space: nowrap; text-shadow: 0 1px 3px #000; letter-spacing: .03em; transition: color .3s ease; }
  .floor { font-size: 20px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; opacity: .85; text-shadow: 0 2px 6px #000; text-align: right; }
  .floor small { display: block; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  /* под «ФРОНТЕНД» — ссылки на видимые фронтенды */
  .floor .sites { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 6px; pointer-events: auto; }
  .floor .sites a { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--text); text-decoration: none; display: inline-flex; gap: 8px; align-items: baseline;
                    padding: 2px 8px; border-radius: 7px; background: rgba(13, 16, 22, .88); border: 1px solid var(--border); text-shadow: none; }
  .floor .sites a:hover { border-color: #9cc0ff; }
  .floor .sites a small { display: inline; font-weight: 400; color: var(--muted); }
  .floor .sites a:hover { color: #9cc0ff; } .floor .sites a:hover small { color: #9cc0ff; }
  .floor.empty { opacity: .45; }
  /* заголовок слоя — ручка: за него слой перетаскивается целиком */
  .floor .ttl { pointer-events: auto; cursor: grab; border-radius: 6px; padding: 0 4px; transition: background .3s ease, box-shadow .3s ease; }
  .floor .ttl:hover, .floor.grab-hl .ttl { background: rgba(255, 255, 255, .08); box-shadow: 0 0 0 1px currentColor; }
  .floor.dragging .ttl { cursor: grabbing; }
  /* папка под курсором: подпись выделена, сама плитка подсвечена в сцене */
  .cl.grab-hl { color: #fff; font-weight: 600; }

  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  /* значок «как читать схему» — только на узких экранах, вместо постоянной легенды */
  #legendBtn { display: none; left: 60px; bottom: 12px; width: 40px; height: 40px; padding: 0; border-radius: 12px;
               align-items: center; justify-content: center; color: var(--muted); }
  #legendBtn:hover, #legendBtn[aria-expanded="true"] { color: var(--text); border-color: var(--accent); }

  /* настройки пользователя: шестерёнка в левом нижнем углу, над ней — панель с ползунками */
  #settingsBtn { left: 12px; bottom: 12px; width: 40px; height: 40px; padding: 0; border-radius: 12px;
                 display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  #settingsBtn svg { transition: transform .4s ease; }
  #settingsBtn:hover, #settingsBtn[aria-expanded="true"] { color: var(--text); border-color: var(--accent); }
  #settingsBtn[aria-expanded="true"] svg { transform: rotate(60deg); }
  #settings { left: 12px; bottom: 60px; width: 320px; max-width: calc(100vw - 24px); padding: 12px 16px 14px; font-size: 13px; z-index: 15; }
  #settings[hidden] { display: none; }
  #settings h2 { font-size: 12px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #settings .sub { margin: -4px 0 12px; color: var(--muted); font-size: 12px; }
  #settings .row { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; align-items: center; margin-bottom: 12px; }
  #settings .row label { font-weight: 600; }
  #settings .row output { font: 12px ui-monospace, Consolas, monospace; color: var(--text); min-width: 40px; text-align: right; }
  #settings .row input { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); cursor: pointer; }
  #settings .row small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
  #settings .foot { display: flex; justify-content: flex-end; }
  #settings .row .reset { background: none; border: 1px solid var(--border); border-radius: 6px; width: 24px; height: 22px; padding: 0;
                          color: var(--muted); font-size: 13px; line-height: 1; }
  #settings .row .reset:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  #settings button:disabled { opacity: .35; cursor: default; }
  #settings .foot button { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; color: var(--muted); }
  #settings .foot button:hover { color: var(--text); border-color: var(--accent); }
  @media (max-width: 760px) {
    #legendBtn { display: inline-flex; }
    #legend { display: none; left: 12px; right: 12px; bottom: 60px; max-width: none; max-height: 60vh; overflow: auto; }
    #legend.open { display: block; }
    #legend summary { pointer-events: none; list-style: none; }
    #legend summary::-webkit-details-marker { display: none; }
    #recent { left: 108px; width: auto; }
    #recent ul { max-height: calc(25vh - 40px); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>

<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="msg">загрузка…</div>

<header id="top" class="panel">
  <h1>Vizor</h1>
  <nav id="tabs" class="group" aria-label="Проекты"></nav>
  <nav class="seg" aria-label="Раздел">
    <a href="/" aria-current="page">Архитектура</a><a href="/status">Статус сервисов</a>
  </nav>
  <div class="seg" id="modeSeg" role="group" aria-label="Вид">
    <button data-mode="2d">2D</button><button data-mode="3d">3D</button>
  </div>
  <div id="layers" class="group" role="group" aria-label="Слои"><span class="cap">Слои:</span></div>
  <div id="services" class="group" role="group" aria-label="Сервисы"><span class="cap">Сервисы:</span></div>
  <span class="meta">
    <span id="updated">—</span>
    <button id="home">Общий вид</button>
    <button id="closeCards" hidden title="Закрыть все карточки запросов">Закрыть детали</button>
    <button id="resetLayout" title="Вернуть перетащенные блоки этого проекта на места по умолчанию">Сбросить расположение</button>
  </span>
</header>

<button id="settingsBtn" class="panel" aria-expanded="false" aria-controls="settings" title="Настройки" aria-label="Настройки">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<aside id="settings" class="panel" hidden aria-label="Настройки">
  <h2>Настройки</h2>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (id) => document.getElementById(id);

/* ---------- словарь: что значит каждый блок, связь и слой ---------- */

const KINDS = {
  page:      { name: 'Страница / экран',      color: 0x4f8cff, shape: 'tall' },
  component: { name: 'Компонент интерфейса',  color: 0x39c0ff, shape: 'cube' },
  unit:      { name: 'Компонент библиотеки',  color: 0xa879ff, shape: 'cube' },
  store:     { name: 'Хранилище состояния',   color: 0xff7ab6, shape: 'cyl' },
  module:    { name: 'Модуль с логикой',      color: 0xf5b544, shape: 'ball' },
  entry:     { name: 'Обработчик запросов',   color: 0xff9f43, shape: 'tall' },
  route:     { name: 'Адрес API',             color: 0xffd166, shape: 'cone' },
  table:     { name: 'Таблица базы данных',   color: 0xe98a4f, shape: 'cyl' },
  style:     { name: 'Стили',                 color: 0x6fd3c1, shape: 'flat' },
  data:      { name: 'Данные / описание',     color: 0x8a94a6, shape: 'flat' },
  config:    { name: 'Настройки сборки',      color: 0x5b6475, shape: 'flat' },
};
const EDGES = {
  import:  { name: 'подключает файл',            color: 0x6d86b8, out: 'Подключает', in: 'Подключается в' },
  route:   { name: 'адрес API → обработчик',      color: 0xffd166, out: 'Обрабатывается в', in: 'Обрабатывает адрес' },
  api:     { name: 'запрос к API (клик — подробности)', color: 0xffd166, out: 'Запрашивает', in: 'Запрашивается из' },
  db:      { name: 'работа с таблицей',          color: 0xe98a4f, out: 'Работает с таблицей', in: 'Используется в' },
  via:     { name: 'через скрытые слои',         color: 0xc0c8d8, out: 'Связан через скрытые слои', in: 'Связан через скрытые слои' },
  service: { name: 'связь сервисов',             color: 0x9aa3b2, out: 'Связан с', in: 'Связан с' },
};
// Этажи сверху вниз. Каждый блок попадает на этаж по своему виду (см. floorOf)
const FLOORS = [
  { key: 'frontend', title: 'ФРОНТЕНД',     short: 'Фронтенд',       sub: 'то, что видит пользователь',            color: 0x4f8cff },
  { key: 'api',      title: 'БЭКЕНД / API', short: 'Бэкенд / API',   sub: 'сервер и адреса, по которым к нему ходят', color: 0xff9f43 },
  { key: 'logic',    title: 'БИЗНЕС-ЛОГИКА', short: 'Бизнес-логика', sub: 'правила и расчёты без интерфейса',       color: 0xc77dff },
  { key: 'db',       title: 'БАЗА ДАННЫХ',  short: 'База данных',    sub: 'где хранятся данные',                    color: 0xe98a4f },
];
const FLOOR_BY_KIND = { page: 'frontend', component: 'frontend', unit: 'frontend', style: 'frontend',
                        route: 'api', entry: 'api', module: 'logic', store: 'logic', table: 'db' };
function floorOf(n) {
  if (FLOOR_BY_KIND[n.kind]) return FLOOR_BY_KIND[n.kind];
  return n.layer === 'frontend' ? 'frontend' : n.layer === 'db' ? 'db' : 'api';   // данные и настройки — к своему сервису
}

const RECENT_MS = 15 * 60 * 1000;
// по связи «запрос к API» точки бегут в обе стороны: жёлтые — запрос к API, зелёные — ответ фронтенду
const RESPONSE_COLOR = 0x5ee0a0;
const HOT_COLOR = 0xffeeb0;
const hex = (c) => '#' + c.toString(16).padStart(6, '0');

for (const k of Object.values(KINDS)) $('kinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:${hex(k.color)}"></span>${k.name}</li>`);
for (const [key, e] of Object.entries(EDGES)) {
  $('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="ln${key === 'via' ? ' dash' : ''}" style="background:${hex(e.color)}"></span>${e.name}</li>`);
}
$('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:${hex(RESPONSE_COLOR)};border-radius:50%"></span>ответ API фронтенду</li>`);
$('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:var(--recent);border-radius:50%"></span>изменён за 15 мин</li>`);
$('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:var(--bad);border-radius:50%"></span>логика без документации</li>`);

/* ---------- настройки вида (запоминаются в браузере) ---------- */

function loadPref(key, def) { try { return JSON.parse(localStorage.getItem('vizor.' + key)) ?? def; } catch { return def; } }
function savePref(key, val) { try { localStorage.setItem('vizor.' + key, JSON.stringify(val)); } catch { /* недоступно */ } }

let mode = loadPref('mode', '3d');
let shown = new Set(loadPref('layers', FLOORS.map((f) => f.key)).filter((k) => FLOORS.some((f) => f.key === k)));
// адрес может задать вид явно: /?mode=2d&layers=frontend,db#проект
const params = new URLSearchParams(location.search);
if (['2d', '3d'].includes(params.get('mode'))) mode = params.get('mode');
if (params.get('layers')) shown = new Set(params.get('layers').split(',').filter((k) => FLOORS.some((f) => f.key === k)));
if (!shown.size) shown = new Set(FLOORS.map((f) => f.key));

// скрытые сервисы хранятся по проектам: { проект: [id, …] }; новый сервис по умолчанию виден
const hiddenServices = loadPref('hiddenServices', {});
let servicesParam = params.get('services') ? params.get('services').split(',') : null;   // /?services=showcase — показать только эти
const hiddenSvc = () => new Set(hiddenServices[current] || []);
let nodeParam = params.get('node');
// перетащенные блоки: { проект: { id: [dx, dz] } } — сдвиг от места по умолчанию в плоскости этажа, общий для 2D и 3D
const offsets = loadPref('offsets', {});

/* ---------- сцена ---------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('scene').append(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('labels') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1016);
scene.fog = new THREE.Fog(0x0d1016, 120, 320);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(40, 38, 70);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;
controls.maxDistance = 600;
controls.zoomToCursor = true;   // приближение — к точке под курсором, а не к центру экрана

// Колесо двигает взгляд, как прокрутка страницы: просто колесо — по вертикали экрана, Shift + колесо — по горизонтали
// (камера и точка, вокруг которой она вращается, вместе). Ctrl + колесо пропускаем в OrbitControls — он приближает.
// Слушатель на родителе в фазе захвата срабатывает раньше OrbitControls. Chrome при Shift отдаёт прокрутку в deltaX;
// тачпад прокручивает двумя пальцами сразу по обеим осям. Щелчок колеса (~100) — около 120 px экрана.
const PAN_PX_PER_DELTA = 1.2;

// Настройки пользователя (шестерёнка слева внизу): множители чувствительности колеса, хранятся в браузере
const SETTINGS = [
  { key: 'zoom', label: 'Приближение', hint: 'Ctrl + колесо', max: 5 },
  { key: 'panX', label: 'Сдвиг по горизонтали', hint: 'Shift + колесо', max: 3 },
  { key: 'panY', label: 'Сдвиг по вертикали', hint: 'колесо', max: 3 },
];
const SETTING_DEFAULT = 1;
const settings = { zoom: 1, panX: 1, panY: 1, ...loadPref('settings', {}) };
function applySettings() {
  controls.zoomSpeed = settings.zoom;
  for (const s of SETTINGS) {
    const input = $('set-' + s.key);
    if (!input) continue;
    input.value = settings[s.key];
    document.querySelector(`output[for="set-${s.key}"]`).textContent = '×' + settings[s.key].toFixed(1);
    // своя кнопка сброса у каждой настройки — доступна, только когда значение отличается от обычного
    document.querySelector(`[data-reset="${s.key}"]`).disabled = settings[s.key] === SETTING_DEFAULT;
  }
  $('settingsReset').disabled = SETTINGS.every((s) => settings[s.key] === SETTING_DEFAULT);
}
const setSetting = (key, value) => { settings[key] = value; applySettings(); savePref('settings', settings); };
$('settingsRows').innerHTML = SETTINGS.map((s) => `<div class="row">
  <label for="set-${s.key}">${s.label}</label><output for="set-${s.key}"></output>
  <button class="reset" data-reset="${s.key}" title="Вернуть ×${SETTING_DEFAULT.toFixed(1)}" aria-label="Вернуть «${s.label}» по умолчанию">↺</button>
  <input id="set-${s.key}" type="range" min="0.2" max="${s.max}" step="0.1">
  <small>${s.hint} · от ×0.2 до ×${s.max}</small></div>`).join('');
$('settingsRows').addEventListener('input', (ev) => {
  const s = SETTINGS.find((x) => 'set-' + x.key === ev.target.id);
  if (s) setSetting(s.key, Number(ev.target.value));
});
$('settingsRows').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-reset]');
  if (b) setSetting(b.dataset.reset, SETTING_DEFAULT);
});
$('settingsReset').onclick = () => {
  for (const s of SETTINGS) settings[s.key] = SETTING_DEFAULT;
  applySettings();
  savePref('settings', settings);
};
function setSettingsOpen(on) {
  $('settings').hidden = !on;
  $('settingsBtn').setAttribute('aria-expanded', String(on));
}
$('settingsBtn').addEventListener('click', () => setSettingsOpen($('settings').hidden));
addEventListener('pointerdown', (ev) => { if (!ev.target.closest('#settings, #settingsBtn')) setSettingsOpen(false); });
applySettings();
$('scene').addEventListener('wheel', (ev) => {
  if (ev.ctrlKey) return;
  ev.preventDefault();
  ev.stopPropagation();
  const dx = ev.shiftKey ? ev.deltaX || ev.deltaY : ev.deltaX;
  const dy = ev.shiftKey ? 0 : ev.deltaY;
  if (!dx && !dy) return;
  flight = null;
  const dist = camera.position.distanceTo(controls.target);
  const unitsPerPx = (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) / innerHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  // колесо вниз — вид едет вниз (схема уходит вверх), как у страницы
  const shift = right.multiplyScalar(dx * PAN_PX_PER_DELTA * settings.panX * unitsPerPx)
    .addScaledVector(up, -dy * PAN_PX_PER_DELTA * settings.panY * unitsPerPx);
  camera.position.add(shift);
  controls.target.add(shift);
}, { capture: true, passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30, 60, 40);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-40, -20, -30);
scene.add(fill);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function label(cls, html) {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  return new CSS2DObject(div);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- состояние ---------- */

let data = null, signature = '', current = null;
let world = null;          // THREE.Group текущего проекта
let view = null;           // узлы, рёбра, платформы и бегущие точки текущей сцены
let hovered = null;
let hoveredEdge = null;   // связь «запрос к API» в фокусе: под курсором на схеме или под курсором её карточка
let hoveredEdgeOnScene = null;
let cardsOf = null;       // проект, чьи карточки сейчас открыты
let status = {};

/* ---------- раскладка ---------- */

const CELL = 3.4;

// Узлы платформы группируются по папкам; папки укладываются «полками»
function layoutPlatform(nodes) {
  const clusters = new Map();
  for (const n of nodes) (clusters.get(n.cluster) || clusters.set(n.cluster, []).get(n.cluster)).push(n);
  const boxes = [...clusters.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([name, list]) => {
    list.sort((a, b) => a.kind.localeCompare(b.kind) || a.label.localeCompare(b.label));
    const cols = Math.ceil(Math.sqrt(list.length * 1.6));
    const rows = Math.ceil(list.length / cols);
    return { name, list, cols, rows, w: cols * CELL, d: rows * CELL + 1.6 };
  });
  const area = boxes.reduce((s, b) => s + (b.w + 2) * (b.d + 2), 0);
  const maxW = Math.max(14, Math.sqrt(area) * 1.5);
  let x = 0, z = 0, rowD = 0, width = 0;
  for (const b of boxes) {
    if (x > 0 && x + b.w > maxW) { x = 0; z += rowD + 2; rowD = 0; }
    b.x = x; b.z = z;
    x += b.w + 2; rowD = Math.max(rowD, b.d); width = Math.max(width, x - 2);
  }
  const depth = z + rowD;
  const pos = new Map();
  for (const b of boxes) {
    b.list.forEach((n, i) => {
      pos.set(n.id, { x: b.x + (i % b.cols) * CELL + CELL / 2 - width / 2, z: b.z + 1.6 + Math.floor(i / b.cols) * CELL + CELL / 2 - depth / 2 });
    });
    b.cx = b.x - width / 2; b.cz = b.z - depth / 2;
  }
  return { boxes, pos, width: Math.max(width, 8), depth: Math.max(depth, 6) };
}

/* ---------- построение ---------- */

function geometryFor(shape) {
  switch (shape) {
    case 'tall': return new THREE.BoxGeometry(1.6, 2.6, 1.6);
    case 'cyl':  return new THREE.CylinderGeometry(0.95, 0.95, 1.6, 24);
    case 'ball': return new THREE.SphereGeometry(0.95, 24, 16);
    case 'cone': return new THREE.ConeGeometry(0.85, 1.8, 4);
    case 'flat': return new THREE.BoxGeometry(1.5, 0.5, 1.5);
    default:     return new THREE.BoxGeometry(1.6, 1.6, 1.6);
  }
}
const GEOMS = Object.fromEntries(['tall', 'cyl', 'ball', 'cone', 'flat', 'cube'].map((s) => [s, geometryFor(s)]));
const HEIGHT = { tall: 2.6, cyl: 1.6, ball: 1.9, cone: 1.8, flat: 0.5, cube: 1.6 };

function disposeWorld() {
  if (!world) return;
  fades.clear();
  colorFades.clear();
  world.traverse((o) => {
    if (o.isCSS2DObject) o.element.remove();
    if (o.geometry && o.geometry !== GLOW_PLANE && !Object.values(GEOMS).includes(o.geometry)) o.geometry.dispose();
    if (o.material?.map && o.userData.ownMap) o.material.map.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(world);
  world = null;
}

// Каждый этаж строится в своей группе как горизонтальная плоскость.
// В 2D группа поворачивается на 90° к зрителю: глубина становится высотой на экране.
function build(project) {
  if (window.vizorDebug) window.vizorDebug.builds++;
  disposeWorld();
  world = new THREE.Group();
  scene.add(world);
  view = { nodes: new Map(), edges: [], platforms: [], clusters: [], floors: [], particles: [], hidden: 0 };

  const floors = FLOORS.filter((f) => shown.has(f.key));
  const offSvc = hiddenSvc();
  const visible = project.nodes.filter((n) => shown.has(floorOf(n)) && !offSvc.has(n.service));
  view.hidden = project.nodes.length - visible.length;

  // платформы: сервис × этаж; сервис без единого файла — пустая платформа на этаже своего типа
  const hasNodes = new Set(project.nodes.map((n) => n.service));
  const plats = floors.map((f) => {
    const list = project.services
      .filter((s) => !offSvc.has(s.id))
      .map((s) => ({ s, nodes: visible.filter((n) => n.service === s.id && floorOf(n) === f.key) }))
      .filter((p) => p.nodes.length || (!hasNodes.has(p.s.id) && floorOf({ layer: p.s.layer }) === f.key));
    for (const p of list) p.L = layoutPlatform(p.nodes);
    const offOnly = !list.length && project.nodes.some((n) => floorOf(n) === f.key);
    return { f, list, offOnly, width: list.reduce((sum, p) => sum + p.L.width + 6, -6), depth: Math.max(18, ...list.map((p) => p.L.depth + 10)) };
  });
  const span = Math.max(30, ...plats.map((p) => p.width + 16));

  // высота этажей: в 3D — равный шаг, в 2D — полосы друг под другом
  const gap3d = Math.min(36, Math.max(14, span * 0.28));
  let y2d = 0;
  plats.forEach((fp, i) => {
    if (mode === '3d') fp.y = -i * gap3d;
    else { fp.y = y2d - fp.depth / 2; y2d -= fp.depth + FLOOR_GAP_2D; }
  });

  for (const fp of plats) {
    const g = new THREE.Group();
    world.add(g);
    const floor = buildFloor(g, fp, span);
    floor.baseY = fp.y;
    floor.tf = floorTf(offsets[current]?.['floorT:' + floor.key]);
    placeFloor(floor);
    let x = -fp.width / 2;
    for (const p of fp.list) {
      const cx = x + p.L.width / 2;
      x += p.L.width + 6;
      buildPlatform(g, floor, p.s, p.L, cx);
    }
    view.floors.push(floor);
  }
  world.updateMatrixWorld(true);
  for (const v of view.nodes.values()) placeNode(v);
  // рамки сразу по фактическим местам блоков (с учётом сохранённых перетаскиваний)
  for (const floor of view.floors) fitFrames(floor);
  if (mode === '2d') restackFloors(view.floors[0]);

  buildEdges(project, visible);
}

/* Скруглённые углы рамок: слой, платформа сервиса, плитка папки. Фигура строится под настоящий размер
   (растянутый масштабом квадрат дал бы овальные углы) и перестраивается, только когда размер меняется. */
const CORNER = { floor: 1.6, platform: 0.9, cluster: 0.5 };
const CURVE_SEGMENTS = 6;
function roundedShape(w, d, r) {
  r = Math.min(r, w / 2, d / 2);
  const x = -w / 2, y = -d / 2, s = new THREE.Shape();
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// плоская заливка и контур (лежат в плоскости XY, повёрнуты к полу через rotation.x = -π/2)
const flatFill = (sh) => new THREE.ShapeGeometry(sh, CURVE_SEGMENTS);
const flatEdge = (sh) => new THREE.BufferGeometry().setFromPoints(sh.getPoints(CURVE_SEGMENTS));
// плита толщиной 0.4: верх на y = 0, низ на y = −0.4
const slabBody = (sh) => new THREE.ExtrudeGeometry(sh, { depth: 0.4, bevelEnabled: false, curveSegments: CURVE_SEGMENTS }).rotateX(-Math.PI / 2).translate(0, -0.4, 0);
// перестроить геометрию объекта под размер w × d, если он изменился; true — перестроена
function setRounded(obj, kind, w, d, build) {
  const size = w.toFixed(3) + 'x' + d.toFixed(3);
  if (obj.userData.size === size) return false;
  obj.userData.size = size;
  obj.geometry.dispose();
  obj.geometry = build(roundedShape(w, d, CORNER[kind]));
  return true;
}

function buildFloor(g, fp, span) {
  const f = fp.f;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ color: f.color, transparent: true, opacity: fp.list.length ? 0.06 : 0.025, side: THREE.DoubleSide, depthWrite: false }),
  );
  plane.rotation.x = -Math.PI / 2;
  g.add(plane);
  const border = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: f.color, transparent: true, opacity: 0.4 }));
  border.rotation.x = -Math.PI / 2;
  g.add(border);
  const fl = label('floor' + (fp.list.length ? '' : ' empty'), `<span class="ttl" style="color:${hex(f.color)}" title="Перетащите, чтобы сдвинуть слой целиком">${f.title}</span><small>${fp.list.length ? f.sub : fp.offOnly ? 'сервисы этого слоя скрыты' : 'в этом проекте нет'}</small>`);
  fl.center.set(1, mode === '3d' ? 0.5 : 0);
  g.add(fl);
  const defaultBase = rect(-span / 2, span / 2, -fp.depth / 2, fp.depth / 2);
  const floor = { key: f.key, g, plane, border, label: fl, defaultBase, base: moveRect(defaultBase, offsets[current]?.['floor:' + f.key] || [0, 0]), plats: [] };
  plane.userData.planeOpacity = plane.material.opacity;
  const handle = fl.element.querySelector('.ttl');
  handle.addEventListener('pointerdown', (ev) => startGroupDrag(ev, { type: 'floor', floor }));
  handle.addEventListener('pointerenter', () => { if (!drag) setHoverGroup({ type: 'floor', floor }); });
  handle.addEventListener('pointerleave', () => { if (!drag && hoverGroup?.floor === floor && hoverGroup.type === 'floor') setHoverGroup(null); });
  // под «ФРОНТЕНД» — ссылки на фронтенды выбранных сервисов, под «БЭКЕНД / API» — на их Swagger
  const links = f.key === 'frontend'
    ? fp.list.filter((p) => /^https?:\/\//.test(p.s.url || '')).map(({ s }) => ({ id: s.id, url: s.url, note: s.url.replace(/^https?:\/\//, '') }))
    : f.key === 'api' ? fp.list.filter((p) => p.s.swagger).map(({ s }) => ({ id: s.id, url: s.swagger, note: 'Swagger' })) : [];
  if (links.length) {
    fl.element.insertAdjacentHTML('beforeend', '<div class="sites">' + links.map((l) =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="Открыть ${esc(l.url)}">${esc(l.id)} <small>${esc(l.note)} ↗</small></a>`).join('') + '</div>');
  }
  return floor;
}

/* Плашка сервиса — «наклейка» на самой плите, в её левом верхнем углу: точка статуса и имя, нарисованные на canvas.
   Лежит в плоскости платформы, поэтому движется, поворачивается и масштабируется вместе с ней.
   Под неё у платформы сверху полоса TAG_BAND, а ширина платформы — не меньше наклейки (см. fitFrames),
   чтобы наклейка не наезжала на папки и читалась при общем виде схемы. */
const TAG_BAND = 4.4, TAG_H = 3.4, TAG_PX = 128;
function makeTag(name) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const font = `600 ${TAG_PX * 0.56}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  // сначала мерим текст, потом задаём размер: смена размера canvas сбрасывает шрифт контекста
  ctx.font = font;
  const textW = ctx.measureText(name).width;
  cv.height = TAG_PX;
  cv.width = Math.ceil(TAG_PX * 0.8 + textW + TAG_PX * 0.35);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();   // чётче, когда плита видна под углом
  const w = (TAG_H * cv.width) / cv.height;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, TAG_H), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.renderOrder = 4;
  mesh.userData.ownMap = true;
  const tag = { mesh, ctx, tex, font, name, w, state: '', hover: false, open: false, drawn: null };
  drawTag(tag);
  return tag;
}
// перерисовка — только когда меняется статус, наведение или открытая карточка
function drawTag(tag, patch = {}) {
  Object.assign(tag, patch);
  const key = [tag.state, tag.hover, tag.open].join();
  if (key === tag.drawn) return;
  tag.drawn = key;
  const { ctx } = tag, cv = ctx.canvas, H = cv.height;
  const lw = H * (tag.hover || tag.open ? 0.05 : 0.025);
  ctx.clearRect(0, 0, cv.width, H);
  ctx.beginPath();
  ctx.roundRect(lw / 2, lw / 2, cv.width - lw, H - lw, H * 0.28);
  ctx.fillStyle = 'rgba(13, 16, 22, 0.88)';
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = tag.hover ? '#9cc0ff' : tag.open ? '#4f8cff' : '#2b3240';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(H * 0.45, H / 2, H * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = tag.state === 'up' ? '#3ecf7d' : tag.state === 'down' ? '#f0605d' : '#8b95a7';
  ctx.fill();
  ctx.font = tag.font;
  ctx.fillStyle = '#e6e9ef';
  ctx.textBaseline = 'middle';
  ctx.fillText(tag.name, H * 0.8, H / 2 + H * 0.03);
  tag.tex.needsUpdate = true;
}

function buildPlatform(g, floor, s, L, cx) {
  const f = FLOORS.find((x) => x.key === floor.key) || floor;
  const w = L.width + 3, d = L.depth + 3;
  const slab = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color: 0x1b2230, transparent: true, opacity: 0.85, roughness: 0.9 }));
  g.add(slab);
  const outline = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x6b7587 }));
  g.add(outline);
  const tag = makeTag(s.id);
  g.add(tag.mesh);
  if (!L.boxes.length) {
    const empty = label('cl', 'пока пустой');
    empty.position.set(cx, 0.05, 0);
    g.add(empty);
  }
  const pl = { service: s.id, floor: f.key, frame: floor, outline, slab, tag, group: g, localCenter: new THREE.Vector3(cx, 0, 0),
               base: rect(cx - w / 2, cx + w / 2, -d / 2, d / 2), clusters: [] };
  slab.userData.group = { type: 'platform', pl, floor };
  view.platforms.push(pl);
  floor.plats.push(pl);

  // плитки и подписи папок; размер плитки задаёт fitFrames по блокам внутри
  for (const b of L.boxes) {
    const cr = { ids: b.list.map((n) => n.id), base: rect(cx + b.cx, cx + b.cx + b.w, b.cz, b.cz + b.d), tile: null, label: null, view: null };
    pl.clusters.push(cr);
    if (!b.name && L.boxes.length === 1) continue;
    cr.tile = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0x2a3446, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
    cr.tile.rotation.x = -Math.PI / 2;
    g.add(cr.tile);
    // длинный путь укорачиваем до двух последних папок: «components/sphere/buttons» → «sphere/buttons»
    cr.label = label('cl', esc(b.name ? b.name.split('/').slice(-2).join('/') : 'основные файлы'));
    cr.label.center.set(0, 0.5);
    g.add(cr.label);
    cr.view = { label: cr.label, w: b.w };
    cr.tile.userData.group = { type: 'cluster', cr, pl, floor };
    view.clusters.push(cr.view);
  }

  for (const n of L.boxes.flatMap((b) => b.list)) {
    const k = KINDS[n.kind] || KINDS.module;
    const p = L.pos.get(n.id);
    const h = HEIGHT[k.shape];
    const [dx, dz] = offsets[current]?.[n.id] || [0, 0];
    const x = cx + p.x + dx, z = p.z + dz;
    const mesh = new THREE.Mesh(GEOMS[k.shape], new THREE.MeshStandardMaterial({ color: k.color, roughness: 0.45, metalness: 0.1, transparent: true, emissive: 0x000000 }));
    mesh.position.set(x, h / 2, z);
    if (k.shape === 'cone') mesh.rotation.y = Math.PI / 4;
    mesh.userData.id = n.id;
    g.add(mesh);
    const lb = label('lbl', esc(n.label));
    // в 3D подпись под блоком на платформе, в 2D — под блоком на экране
    lb.position.set(0, mode === '3d' ? -h / 2 : 0, mode === '3d' ? 0 : 1.1);
    lb.center.set(0.5, 0);
    mesh.add(lb);
    view.nodes.set(n.id, { n, floor: f.key, mesh, label: lb, group: g, auto: [cx + p.x, p.z], frame: floor, raw: { x, z }, h,
      localBase: new THREE.Vector3(x, 0, z), localTop: new THREE.Vector3(x, h, z), ring: null, out: [], in: [] });
  }
}

/* ---------- рамки по содержимому ---------- */

// прямоугольник в плоскости этажа (локальные x и z группы этажа)
const rect = (x0, x1, z0, z1) => ({ x0, x1, z0, z1 });
const union = (a, b) => (b ? rect(Math.min(a.x0, b.x0), Math.max(a.x1, b.x1), Math.min(a.z0, b.z0), Math.max(a.z1, b.z1)) : a);
const grow = (r, m) => rect(r.x0 - m, r.x1 + m, r.z0 - m, r.z1 + m);

// Рамки этажа подстраиваются под блоки: плитка папки ⊇ её блоки, платформа ⊇ её папки, этаж ⊇ платформы.
// Меньше исходного размера рамка не становится — вернули блок, и она сжимается обратно.
// Папки одной платформы и платформы одного этажа не накладываются: когда тащат блок (anchorId), его папка
// и платформа стоят на месте, а те, к кому они приблизились, отъезжают вместе со своими блоками (по цепочке).
// Положение блока = raw (место по умолчанию + сохранённый сдвиг) + отъезд его папки + отъезд его платформы.
const CLUSTER_GAP = 2, PLATFORM_GAP = 6;

// прямоугольник по блокам, не меньше исходного размера (растёт от левого верхнего угла блоков)
function boundsOf(points, min, pad = 0) {
  if (!points.length) return min;
  let r = null;
  for (const [x, z] of points) r = union(rect(x - CELL / 2, x + CELL / 2, z - CELL / 2 - 1.6, z + CELL / 2), r);
  r = grow(r, pad);
  return rect(r.x0, Math.max(r.x1, r.x0 + (min.x1 - min.x0)), r.z0, Math.max(r.z1, r.z0 + (min.z1 - min.z0)));
}
const moveRect = (r, [dx, dz]) => rect(r.x0 + dx, r.x1 + dx, r.z0 + dz, r.z1 + dz);

// раздвинуть прямоугольники: неподвижный якорь толкает соседей, сдвинутые толкают дальше
function separate(rects, anchor, gap) {
  const shift = rects.map(() => [0, 0]);
  if (anchor < 0) return shift;
  const fixed = new Set([anchor]);
  for (let pass = 0, changed = true; changed && pass < rects.length * 4; pass++) {
    changed = false;
    for (const i of [...fixed]) {
      for (let j = 0; j < rects.length; j++) {
        if (fixed.has(j)) continue;
        const a = moveRect(rects[i], shift[i]), b = moveRect(rects[j], shift[j]);
        const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) + gap, oz = Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0) + gap;
        if (ox <= 1e-6 || oz <= 1e-6) continue;
        // отодвигаем по оси, где пересечение меньше, — в сторону от толкающего
        if (ox < oz) shift[j][0] += (b.x0 + b.x1 >= a.x0 + a.x1 ? 1 : -1) * ox;
        else shift[j][1] += (b.z0 + b.z1 >= a.z0 + a.z1 ? 1 : -1) * oz;
        fixed.add(j);
        changed = true;
      }
    }
  }
  return shift;
}

function fitFrames(floor, anchorId = null) {
  const nodesOf = (cr) => cr.ids.map((id) => view.nodes.get(id)).filter(Boolean);
  // 1. папки внутри каждой платформы
  const platRects = [];
  for (const pl of floor.plats) {
    const raw = pl.clusters.map((cr) => boundsOf(nodesOf(cr).map((v) => [v.raw.x, v.raw.z]), cr.base));
    const anchor = pl.clusters.findIndex((cr) => cr.ids.includes(anchorId));
    pl.clusterShift = separate(raw, anchor, CLUSTER_GAP);
    const placed = raw.map((r, i) => moveRect(r, pl.clusterShift[i]));
    // платформа ⊇ её папки с отступом 1.5, не меньше исходного размера; пустая — как была
    let pr = null;
    for (const r of placed) pr = union(grow(r, 1.5), pr);
    if (pr) pr = rect(pr.x0, Math.max(pr.x1, pr.x0 + pl.tag.w + 1), pr.z0 - TAG_BAND, pr.z1);
    pl.rawRect = pr ? rect(pr.x0, Math.max(pr.x1, pr.x0 + (pl.base.x1 - pl.base.x0)), pr.z0, Math.max(pr.z1, pr.z0 + (pl.base.z1 - pl.base.z0)))
      : rect(pl.base.x0, Math.max(pl.base.x1, pl.base.x0 + pl.tag.w + 1), pl.base.z0, pl.base.z1);
    platRects.push(pl.rawRect);
  }
  // 2. платформы внутри этажа
  const platAnchor = floor.plats.findIndex((pl) => pl.clusters.some((cr) => cr.ids.includes(anchorId)));
  const platShift = separate(platRects, platAnchor, PLATFORM_GAP);

  // 3. итоговые места блоков и рамки
  const moved = new Set();
  let fr = floor.base;
  floor.plats.forEach((pl, pi) => {
    const [px, pz] = platShift[pi];
    pl.clusters.forEach((cr, ci) => {
      const [cx, cz] = pl.clusterShift[ci];
      const pts = [];
      for (const v of nodesOf(cr)) {
        const x = v.raw.x + cx + px, z = v.raw.z + cz + pz;
        if (Math.abs(v.localBase.x - x) > 1e-6 || Math.abs(v.localBase.z - z) > 1e-6) {
          v.localBase.x = v.localTop.x = v.mesh.position.x = x;
          v.localBase.z = v.localTop.z = v.mesh.position.z = z;
          for (const ring of [v.ring, v.docRing, v.openRing]) if (ring) ring.position.set(x, ring.position.y, z);
          placeNode(v);
          moved.add(v);
        }
        pts.push([x, z]);
      }
      const r = boundsOf(pts, moveRect(cr.base, [cx + px, cz + pz]));
      if (cr.tile) {
        cr.tile.position.set((r.x0 + r.x1) / 2, 0.02, (r.z0 + r.z1) / 2);
        setRounded(cr.tile, 'cluster', r.x1 - r.x0 + 0.6, r.z1 - r.z0 + 0.4, flatFill);
        cr.label.position.set(r.x0 + 0.2, 0.05, r.z0 + 0.7);
        cr.view.w = r.x1 - r.x0;
      }
    });
    const pr = moveRect(pl.rawRect, [px, pz]);
    pl.rect = pr;   // текущая рамка платформы в плоскости этажа — из её углов и середин сторон выходит выноска карточки
    for (const o of [pl.slab, pl.outline]) o.position.set((pr.x0 + pr.x1) / 2, 0, (pr.z0 + pr.z1) / 2);
    if (setRounded(pl.slab, 'platform', pr.x1 - pr.x0, pr.z1 - pr.z0, slabBody)) {
      pl.outline.geometry.dispose();
      pl.outline.geometry = new THREE.EdgesGeometry(pl.slab.geometry, 30);
    }
    // наклейка не шире платформы: у узкой — уменьшается целиком
    const fit = Math.min(1, (pr.x1 - pr.x0 - 1) / pl.tag.w);
    pl.tag.mesh.scale.set(fit, fit, 1);
    pl.tag.mesh.position.set(pr.x0 + 0.5 + (pl.tag.w * fit) / 2, 0.04, pr.z0 + 0.5 + (TAG_H * fit) / 2);
    pl.localCenter.set((pr.x0 + pr.x1) / 2, 0, (pr.z0 + pr.z1) / 2);
    pl.center = pl.group.localToWorld(pl.localCenter.clone());
    fr = union(fr, grow(pr, 3));
  });
  for (const o of [floor.plane, floor.border]) o.position.set((fr.x0 + fr.x1) / 2, -0.3, (fr.z0 + fr.z1) / 2);
  setRounded(floor.plane, 'floor', fr.x1 - fr.x0, fr.z1 - fr.z0, flatFill);
  setRounded(floor.border, 'floor', fr.x1 - fr.x0, fr.z1 - fr.z0, flatEdge);
  floor.label.position.set(fr.x0 - 1, 0, mode === '3d' ? (fr.z0 + fr.z1) / 2 : fr.z0 + 3);
  floor.rect = fr;
  return moved;
}

// 2D: этажи — полосы сверху вниз с постоянным зазором. Этаж-якорь (тот, где тащат блок) стоит на месте,
// остальные раздвигаются от его рамки вверх и вниз — и сходятся обратно, когда рамка сжимается.
// Группа этажа повёрнута к зрителю: локальная z идёт вниз по экрану, поэтому верх полосы — y − z0, низ — y − z1.
const FLOOR_GAP_2D = 6;
function restackFloors(anchor) {
  const floors = view.floors, at = floors.indexOf(anchor);
  if (at < 0) return;
  const moved = new Set();
  const setY = (f, y) => { if (Math.abs(f.baseY - y) > 1e-6) { f.baseY = y; placeFloor(f); moved.add(f); } };
  let top = anchor.baseY - anchor.rect.z0, bottom = anchor.baseY - anchor.rect.z1;
  for (let i = at - 1; i >= 0; i--) {
    const f = floors[i];
    setY(f, top + FLOOR_GAP_2D + f.rect.z1);
    top = f.baseY - f.rect.z0;
  }
  for (let i = at + 1; i < floors.length; i++) {
    const f = floors[i];
    setY(f, bottom - FLOOR_GAP_2D + f.rect.z0);
    bottom = f.baseY - f.rect.z1;
  }
  refreshFloors(moved);
}

/* Преобразование слоя: собственный поворот rot (накопленные повороты вокруг осей самого слоя) и сдвиг shift.
   Положение: q = q0 · rot (q0 — базовый разворот слоя: в 2D он смотрит на зрителя);
   позиция = (0, baseY, 0) + q0·c − q·c + shift, где c — центр рамки по умолчанию (опорная точка формулы).
   Поворот выполняет rotateFloor — вокруг осей слоя через его текущий центр, подбирая shift так, чтобы центр стоял на месте.
   Хранится в offsets как floorT:<слой> = [rot.x, rot.y, rot.z, rot.w, dx, dy, dz], сбрасывается «Сбросить расположение». */
const AXIS_X = new THREE.Vector3(1, 0, 0), AXIS_Y = new THREE.Vector3(0, 1, 0), AXIS_Z = new THREE.Vector3(0, 0, 1);
const baseQuat = () => (mode === '2d' ? new THREE.Quaternion().setFromAxisAngle(AXIS_X, Math.PI / 2) : new THREE.Quaternion());
const defaultCenter = (f) => new THREE.Vector3((f.defaultBase.x0 + f.defaultBase.x1) / 2, 0, (f.defaultBase.z0 + f.defaultBase.z1) / 2);
function floorTf(saved) {
  if (saved?.length === 7) return { rot: new THREE.Quaternion(...saved.slice(0, 4)), shift: new THREE.Vector3(...saved.slice(4)) };
  if (saved?.length === 5) {
    // формат [rx, ry, dx, dy, dz] — повороты в осях сцены: q = Ry · Rx · q0 → rot = q0⁻¹ · Ry · Rx · q0
    const [rx, ry, dx, dy, dz] = saved, q0 = baseQuat();
    const rot = q0.clone().invert()
      .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Y, ry))
      .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_X, rx))
      .multiply(q0);
    return { rot, shift: new THREE.Vector3(dx, dy, dz) };
  }
  // самый ранний формат [yaw, tilt, lift] — переносится только подъём
  return { rot: new THREE.Quaternion(), shift: new THREE.Vector3(0, saved?.length === 3 ? saved[2] : 0, 0) };
}
function placeFloor(f) {
  const q0 = baseQuat(), q = q0.clone().multiply(f.tf.rot), c = defaultCenter(f);
  f.g.quaternion.copy(q);
  f.g.position.set(0, f.baseY, 0).add(c.clone().applyQuaternion(q0)).sub(c.applyQuaternion(q)).add(f.tf.shift);
}
// поворот вокруг собственной оси слоя (AXIS_X — вдоль его ширины, AXIS_Z — вдоль глубины, AXIS_Y — перпендикуляр к плоскости)
// через текущий центр его рамки: этот центр в мире остаётся на месте
function rotateFloor(f, axis, angle) {
  const r = f.rect || f.defaultBase;
  const p = new THREE.Vector3((r.x0 + r.x1) / 2, 0, (r.z0 + r.z1) / 2).sub(defaultCenter(f));   // центр относительно опорной точки
  const q0 = baseQuat(), q = q0.clone().multiply(f.tf.rot);
  const rot = f.tf.rot.clone().multiply(new THREE.Quaternion().setFromAxisAngle(axis, angle));
  const q2 = q0.clone().multiply(rot);
  const shift = f.tf.shift.clone().add(p.clone().applyQuaternion(q)).sub(p.applyQuaternion(q2));
  return { rot, shift };
}

// после сдвига или поворота слоёв: мировые точки их блоков и платформ, и связи, которые к ним ведут
function refreshFloors(moved) {
  if (!moved.size) return;
  for (const f of moved) f.g.updateMatrixWorld(true);
  const shifted = new Set();
  for (const v of view.nodes.values()) if (moved.has(v.frame)) { placeNode(v); shifted.add(v); }
  for (const pl of view.platforms) if ([...moved].some((f) => f.plats.includes(pl))) pl.center = pl.group.localToWorld(pl.localCenter.clone());
  for (const rec of view.edges) if (shifted.has(rec.a) || shifted.has(rec.b) || rec.e.kind === 'service') refreshEdge(rec);
}

// мировые точки узла: основание (для камеры и колец) и точка крепления связей
function placeNode(v) {
  v.base = v.group.localToWorld(v.localBase.clone());
  v.anchor = v.group.localToWorld(mode === '3d' ? v.localTop.clone() : v.localBase.clone().setY(v.localTop.y + 0.4));
}

/* ---------- связи ---------- */

function curveBetween(a, b, kind) {
  if (kind === 'service') {
    const mid = a.center.clone().add(b.center).multiplyScalar(0.5);
    if (mode === '3d') mid.z -= 10; else mid.x += 10;
    return new THREE.QuadraticBezierCurve3(a.center.clone(), mid, b.center.clone());
  }
  const start = a.anchor.clone(), end = b.anchor.clone();
  const mid = start.clone().add(end).multiplyScalar(0.5);
  const dist = start.distanceTo(end);
  const lift = Math.min(10, 1.2 + dist * 0.28);
  if (mode === '3d') {
    if (a.floor === b.floor) mid.y += lift;
    else { mid.x += (end.x - start.x) * 0.1; mid.z += 4; }
  } else {
    // в плоскости дугу выгибаем вбок от прямой
    const d = end.clone().sub(start);
    const side = new THREE.Vector3(-d.y, d.x, 0).normalize();
    mid.addScaledVector(side, a.floor === b.floor ? lift * 0.6 : Math.min(6, dist * 0.12));
  }
  return new THREE.QuadraticBezierCurve3(start, mid, end);
}

function addEdgeObject(e, a, b) {
  const meta = EDGES[e.kind] || EDGES.import;
  const curve = curveBetween(a, b, e.kind);
  let obj;
  if (e.kind === 'via') {
    obj = new THREE.Line(edgeGeometry(e.kind, curve), new THREE.LineDashedMaterial({ color: meta.color, dashSize: 0.8, gapSize: 0.5, transparent: true, opacity: 0.8 }));
    obj.computeLineDistances();
  } else if (e.kind === 'import' || e.kind === 'route') {
    obj = new THREE.Line(edgeGeometry(e.kind, curve), new THREE.LineBasicMaterial({ color: meta.color, transparent: true, opacity: e.kind === 'route' ? 0.7 : 0.35 }));
  } else {
    obj = new THREE.Mesh(edgeGeometry(e.kind, curve), new THREE.MeshBasicMaterial({ color: meta.color, transparent: true, opacity: 0.75 }));
  }
  const rec = { e, obj, base: obj.material.opacity, a, b, dots: [], hot: false, curve };
  if (e.kind === 'api' || e.kind === 'db' || e.kind === 'service') {
    // бегущие точки показывают направление запроса; у запроса к API ещё и ответ — обратно, своим цветом
    const back = e.kind === 'api' ? [false, true] : [false];
    for (const isBack of back) {
      for (let i = 0; i < 3; i++) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(e.kind === 'service' ? 0.35 : 0.22, 10, 8),
          new THREE.MeshBasicMaterial({ color: isBack ? RESPONSE_COLOR : meta.color, transparent: true }));
        world.add(dot);
        const particle = { dot, curve, t: i / 3 + (isBack ? 1 / 6 : 0), edge: e, rec, back: isBack };
        view.particles.push(particle);
        rec.dots.push(particle);
      }
    }
  }
  if (e.kind === 'api') {
    // тонкую трубку трудно поймать мышью — рядом невидимая толстая, по ней наведение и клик
    rec.hit = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.7, 6), new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, transparent: true, opacity: 0 }));
    rec.hit.userData.edge = rec;
    world.add(rec.hit);
  }
  world.add(obj);
  view.edges.push(rec);
}

// hot — связь под курсором или выбранная: трубка толще
function edgeGeometry(kind, curve, hot = false) {
  if (kind === 'via') return new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
  if (kind === 'import' || kind === 'route') return new THREE.BufferGeometry().setFromPoints(curve.getPoints(24));
  return new THREE.TubeGeometry(curve, 40, kind === 'service' ? 0.18 : hot ? 0.26 : 0.09, 8);
}

// связь заново прокладывается между текущими положениями концов (после перетаскивания блока)
function refreshEdge(rec) {
  const curve = curveBetween(rec.a, rec.b, rec.e.kind);
  rec.curve = curve;
  rec.obj.geometry.dispose();
  rec.obj.geometry = edgeGeometry(rec.e.kind, curve, rec.hot);
  if (rec.e.kind === 'via') rec.obj.computeLineDistances();
  if (rec.hit) { rec.hit.geometry.dispose(); rec.hit.geometry = new THREE.TubeGeometry(curve, 24, 0.7, 6); }
  if (rec.glow) { rec.glow.geometry.dispose(); rec.glow.geometry = new THREE.TubeGeometry(curve, 40, GLOW_RADIUS, 10); }
  for (const p of rec.dots) p.curve = curve;
}

// Блок с открытой карточкой: в цикле отрисовки плавно растёт до OPEN_SCALE и светится; под ним пульсирует кольцо его цвета.
// Кольцо повторяет основание блока: под кубами, высокими и плоскими блоками и пирамидами — квадратное, под шарами и цилиндрами — круглое.
const OPEN_SCALE = 1.7;
const ROUND_SHAPES = new Set(['ball', 'cyl']);

// Размытая подсветка — плоскость GLOW_SIZE × GLOW_SIZE с текстурой, нарисованной на canvas: мягкий широкий ореол
// и более чёткая сердцевина. Контур: круг радиусом 1.85 или квадрат с полустороной 1.65 — чуть шире увеличенного блока
const GLOW_SIZE = 6, GLOW_PX = 256;
const GLOW_PLANE = new THREE.PlaneGeometry(GLOW_SIZE, GLOW_SIZE);
const glowTextures = {};
function glowTexture(round) {
  const key = round ? 'round' : 'square';
  if (glowTextures[key]) return glowTextures[key];
  const cv = document.createElement('canvas');
  cv.width = cv.height = GLOW_PX;
  const ctx = cv.getContext('2d');
  const px = GLOW_PX / GLOW_SIZE, mid = GLOW_PX / 2;
  const outline = () => {
    ctx.beginPath();
    if (round) ctx.arc(mid, mid, 1.85 * px, 0, Math.PI * 2);
    else ctx.roundRect(mid - 1.65 * px, mid - 1.65 * px, 3.3 * px, 3.3 * px, 0.35 * px);
  };
  ctx.strokeStyle = '#fff';
  for (const [blur, width, alpha] of [[16, 0.6, 1], [16, 0.6, 1], [7, 0.3, 1], [2, 0.12, 1]]) {
    ctx.filter = `blur(${blur}px)`;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width * px;
    outline();
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return (glowTextures[key] = tex);
}
function setNodeOpen(v, on) {
  if (on === !!v.open) return;
  v.open = on;
  if (on) {
    const k = KINDS[v.n.kind] || KINDS.module;
    const round = ROUND_SHAPES.has(k.shape);
    v.openRing = new THREE.Mesh(GLOW_PLANE, new THREE.MeshBasicMaterial({ color: k.color, map: glowTexture(round), transparent: true,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
    v.openRing.rotation.x = -Math.PI / 2;
    v.openRing.position.copy(v.localBase).setY(0.08);
    // поверх полупрозрачных платформ и плиток папок, иначе в 3D они рисуются после подсветки и гасят её
    v.openRing.renderOrder = 5;
    v.group.add(v.openRing);
  } else {
    v.group.remove(v.openRing); v.openRing.material.dispose(); v.openRing = null;   // плоскость и текстура общие
    v.mesh.material.emissive.setHex(v.recent ? 0x5a4a00 : 0x000000);
  }
}

// ореол связи с открытой карточкой: широкая полупрозрачная трубка с аддитивным смешением
const GLOW_RADIUS = 0.55;
function setEdgeGlow(rec, on) {
  if (on === !!rec.glow) return;
  if (on) {
    rec.glow = new THREE.Mesh(new THREE.TubeGeometry(rec.curve, 40, GLOW_RADIUS, 10),
      new THREE.MeshBasicMaterial({ color: EDGES.api.color, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false }));
    rec.glow.renderOrder = 5;
    world.add(rec.glow);
  } else {
    world.remove(rec.glow);
    rec.glow.geometry.dispose(); rec.glow.material.dispose();
    rec.glow = null;
  }
}

// утолщение и подсветка связи под курсором или с открытой карточкой
function setEdgeHot(rec, hot) {
  if (rec.hot === hot) return;
  rec.hot = hot;
  rec.obj.geometry.dispose();
  rec.obj.geometry = edgeGeometry(rec.e.kind, rec.curve, hot);
  rec.obj.material.color.setHex(hot ? HOT_COLOR : (EDGES[rec.e.kind] || EDGES.import).color);
  for (const p of rec.dots) p.dot.scale.setScalar(hot ? 1.7 : 1);
}

// Связи между видимыми блоками. Если путь идёт через скрытые слои (например фронтенд → API → логика → таблица,
// а показаны только фронтенд и база), рисуется пунктирная связь «через скрытые слои».
function buildEdges(project, visible) {
  const vis = new Set(visible.map((n) => n.id));
  const byId = new Map(project.nodes.map((n) => [n.id, n]));
  const out = new Map();
  for (const e of project.edges) (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);

  const keys = new Set();
  const add = (e) => {
    const a = view.nodes.get(e.from), b = view.nodes.get(e.to);
    const key = e.from + '>' + e.to;
    if (!a || !b || keys.has(key)) return;
    keys.add(key);
    addEdgeObject(e, a, b);
    a.out.push(e); b.in.push(e);
  };
  for (const e of project.edges) if (vis.has(e.from) && vis.has(e.to)) add(e);

  if (view.hidden) {
    for (const src of vis) {
      // обход только по скрытым блокам, пока не дойдём до видимого
      const seen = new Set([src]);
      const queue = (out.get(src) || []).filter((e) => !vis.has(e.to)).map((e) => ({ id: e.to, via: [e.to] }));
      while (queue.length) {
        const { id, via } = queue.shift();
        if (seen.has(id)) continue;
        seen.add(id);
        if (vis.has(id)) {
          // скрытый блок назван по причине: выключен его сервис или его слой
          const offSvc = hiddenSvc();
          const why = (h) => { const n = byId.get(h); return offSvc.has(n.service) ? `сервис ${n.service}` : FLOORS.find((f) => f.key === floorOf(n)).short; };
          const floors = [...new Set(via.slice(0, -1).map(why))];
          add({ from: src, to: id, kind: 'via', label: 'через: ' + floors.join(', '), path: via.slice(0, -1).map((h) => byId.get(h).label) });
          continue;
        }
        if (via.length > 8) continue;
        for (const e of out.get(id) || []) if (!seen.has(e.to)) queue.push({ id: e.to, via: [...via, e.to] });
      }
    }
  }

  // когда связей много, подключения и обходные связи бледнее; связи блока под курсором всё равно подсвечиваются
  if (view.edges.length > 80) {
    for (const r of view.edges) if (r.e.kind === 'import' || r.e.kind === 'via') r.obj.material.opacity = r.base = r.e.kind === 'via' ? 0.2 : 0.16;
  }

  // связи из vizor.json между сервисами, у которых не нашлось связей на уровне файлов
  const svcOf = (id) => byId.get(id)?.service;
  for (const l of project.links) {
    const found = project.edges.some((e) => svcOf(e.from) === l.from && svcOf(e.to) === l.to && e.kind !== 'import');
    const a = view.platforms.find((p) => p.service === l.from), b = view.platforms.find((p) => p.service === l.to);
    if (found || !a || !b || l.from === l.to) continue;
    addEdgeObject({ kind: 'service', from: l.from, to: l.to, label: l.label }, a, b);
  }
}

/* ---------- камера ---------- */

function applyControls() {
  controls.enableRotate = mode === '3d';
  controls.mouseButtons = mode === '3d'
    ? { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN }
    : { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  $('hint').textContent = mode === '3d'
    ? 'Тяните мышью — вращать, колесо — сдвиг вверх-вниз, Shift + колесо — вбок, Ctrl + колесо — приблизить к курсору, правая кнопка — сдвинуть. Блок, папку и сервис можно перетащить, слой — за его название; зажав название слоя: колесо — поворот вокруг X, Shift + колесо — вокруг Z, Alt + колесо — вокруг Y, W/S — от себя/к себе, A/D — влево/вправо, пробел/C — выше/ниже. Клик по блоку или по жёлтой связи «запрос к API» — карточка с подробностями рядом со схемой; её можно отвести за шапку, Esc закрывает верхнюю.'
    : 'Тяните мышью — сдвинуть, колесо — сдвиг вверх-вниз, Shift + колесо — вбок, Ctrl + колесо — приблизить к курсору. Блок, папку и сервис можно перетащить, слой — за его название; зажав название слоя: колесо — поворот вокруг X, Shift + колесо — вокруг Z, Alt + колесо — вокруг Y, W/S — от себя/к себе, A/D — влево/вправо, пробел/C — выше/ниже. Клик по блоку или по жёлтой связи «запрос к API» — карточка с подробностями рядом со схемой; её можно отвести за шапку, Esc закрывает верхнюю.';
}

function fitCamera() {
  if (!world) return;
  const box = new THREE.Box3().setFromObject(world);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  let pos, r;
  if (mode === '3d') {
    r = Math.max(size.x, size.y * 1.4, size.z) * 0.8 + 10;
    pos = new THREE.Vector3(center.x + r * 0.45, center.y + r * 0.55, center.z + r * 1.05);
  } else {
    const fov = THREE.MathUtils.degToRad(camera.fov);
    // слева от этажей стоят их подписи (до ~24 единиц) — оставляем им место
    const LABEL_W = 24;
    center.x -= LABEL_W / 2;
    r = (Math.max(size.y, (size.x + LABEL_W) / camera.aspect) / 2 / Math.tan(fov / 2)) * 1.12 + 6;
    pos = new THREE.Vector3(center.x, center.y, center.z + r);
  }
  fitDistance = pos.distanceTo(center);
  scene.fog.near = r * 1.6;
  scene.fog.far = r * 4;
  flyTo(center, pos);
}

let flight = null;
function flyTo(target, position) {
  flight = { t: 0, fromT: controls.target.clone(), toT: target.clone(), fromP: camera.position.clone(), toP: position.clone() };
}
function focusNode(id) {
  const v = view?.nodes.get(id);
  if (!v) return;
  const dir = mode === '3d' ? camera.position.clone().sub(controls.target).normalize() : new THREE.Vector3(0, 0, 1);
  flyTo(v.base, v.base.clone().add(dir.multiplyScalar(26)));
  openCard('node', v);
}

/* ---------- подсветка и подробности ---------- */

function neighbours(id) {
  const set = new Set([id]);
  const v = view.nodes.get(id);
  if (!v) return set;
  v.out.forEach((e) => set.add(e.to));
  v.in.forEach((e) => set.add(e.from));
  return set;
}

// Подсветка меняется плавно: прозрачность и цвет материалов доводятся до цели за FADE_MS (подписи — CSS-переходом той же длины)
const FADE_MS = 300;
const fades = new Map();        // материал → { from, to, t0 } — прозрачность
const colorFades = new Map();   // материал → { from: Color, to: Color, t0 } — цвет
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function fadeTo(mat, to) {
  const f = fades.get(mat);
  if ((f ? f.to : mat.opacity) === to) return;
  fades.set(mat, { from: mat.opacity, to, t0: performance.now() });
}
function fadeColorTo(mat, hexTo) {
  const f = colorFades.get(mat);
  if ((f ? f.to.getHex() : mat.color.getHex()) === hexTo) return;
  colorFades.set(mat, { from: mat.color.clone(), to: new THREE.Color(hexTo), t0: performance.now() });
}
function stepFades(now) {
  for (const [mat, f] of fades) {
    const t = Math.min(1, (now - f.t0) / FADE_MS);
    mat.opacity = f.from + (f.to - f.from) * easeInOut(t);
    if (t >= 1) fades.delete(mat);
  }
  for (const [mat, f] of colorFades) {
    const t = Math.min(1, (now - f.t0) / FADE_MS);
    mat.color.lerpColors(f.from, f.to, easeInOut(t));
    if (t >= 1) colorFades.delete(mat);
  }
}

// В фокусе либо блок под курсором (на схеме или его карточка) с его связями, либо связь «запрос к API» с её концами.
// Связи с открытыми карточками светятся всегда, их концы и блоки с открытыми карточками не гаснут.
function applyHighlight() {
  if (!view) return;
  const openEdges = new Set(), keep = new Set();
  for (const c of cards.values()) {
    if (!c.target) continue;
    if (c.type === 'edge') { openEdges.add(c.target); keep.add(c.target.e.from).add(c.target.e.to); } else if (c.type === 'node') keep.add(c.id);
  }
  hoveredEdge = hoveredCard?.type === 'edge' ? hoveredCard.target : hoveredEdgeOnScene;
  const hoverNode = hovered || (hoveredCard?.type === 'node' ? hoveredCard.id : null);
  const edge = hoverNode ? null : hoveredEdge;
  const focus = edge ? null : hoverNode;
  const near = edge ? new Set([edge.e.from, edge.e.to]) : focus ? neighbours(focus) : null;
  const edgeOn = (r) => openEdges.has(r) || (edge ? r === edge : !focus || r.e.from === focus || r.e.to === focus);
  for (const [id, v] of view.nodes) {
    const on = !near || near.has(id) || keep.has(id);
    fadeTo(v.mesh.material, on ? 1 : 0.15);
    v.label.element.style.opacity = on ? '' : '0.15';
    v.label.element.classList.toggle('hl', id === focus || (!!edge && near.has(id)) || keep.has(id));
    setNodeOpen(v, cards.has('node:' + id));
  }
  for (const r of view.edges) {
    fadeTo(r.obj.material, edgeOn(r) ? (focus || edge || openEdges.has(r) ? 1 : r.base) : 0.04);
    if (r.hit) { setEdgeHot(r, r === hoveredEdge || openEdges.has(r)); setEdgeGlow(r, openEdges.has(r)); }
  }
  for (const p of view.particles) fadeTo(p.dot.material, edgeOn(p.rec) ? 1 : 0);
  for (const pl of view.platforms) paintPlatform(pl);
}

function ago(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) return `${Math.round(s / 60)} мин назад`;
  if (s < 86400) return `${Math.round(s / 3600)} ч назад`;
  return new Date(ms).toLocaleDateString();
}

// содержимое карточки блока: что это, где лежит, документация, адреса в Swagger и связи
function nodeHtml(v) {
  const n = v.n, k = KINDS[n.kind] || KINDS.module;
  const svc = data.projects.find((p) => p.name === current).services.find((s) => s.id === n.service);
  const item = (otherId, e) => {
    const o = view.nodes.get(otherId)?.n;
    if (!o) return '';
    const rel = e.kind === 'via' ? `${e.label} (${e.path.join(' → ')})` : e.label || '';
    const link = e.kind === 'api' ? `<button class="linkbtn" data-link="${esc(e.from + '>' + e.to)}" title="Что уходит в API и что приходит обратно">запрос ⇄ ответ</button>` : '';
    return `<li><button data-go="${esc(otherId)}"><span class="sw" style="background:${hex((KINDS[o.kind] || KINDS.module).color)}"></span>${esc(o.label)} <span class="rel">${esc(rel)}</span></button>${link}</li>`;
  };
  const groups = {};
  for (const e of v.out) (groups[EDGES[e.kind].out] ||= []).push(item(e.to, e));
  for (const e of v.in) (groups[EDGES[e.kind].in + (e.kind === 'via' ? ' (входящие)' : '')] ||= []).push(item(e.from, e));
  return `
    <div class="kind"><span class="sw" style="display:inline-block;background:${hex(k.color)}"></span> ${k.name}</div>
    <dl>
      <dt>Слой</dt><dd>${FLOORS.find((f) => f.key === v.floor).short}</dd>
      <dt>Сервис</dt><dd>${esc(svc ? `${svc.id} (${svc.stack || svc.type})` : n.service)}</dd>
      <dt>Где лежит</dt><dd>${esc(n.path)}</dd>
      ${n.files.length > 1 ? `<dt>Файлов</dt><dd>${n.files.length}: ${n.files.map((f) => esc(f.split('/').pop())).join(', ')}</dd>` : ''}
      ${n.mtime ? `<dt>Изменён</dt><dd>${ago(n.mtime)}</dd>` : ''}
    </dl>
    ${n.doc ? `<h4>Документация</h4><p class="doc"><a href="/doc?project=${encodeURIComponent(current)}&path=${encodeURIComponent(n.doc)}" target="_blank" rel="noopener">${esc(n.doc.split('/').pop())} ↗</a>
      <span class="rel">Markdown, можно перенести на вики</span></p>`
      : v.floor === 'logic' ? `<h4>Документация</h4><p class="rel">Документации нет: нужен файл ${esc(n.path.replace(/\.[^./]+$/, '.md').split('/').pop())} рядом с ${esc(n.path.split('/').pop())}</p>` : ''}
    ${n.api?.length ? `<h4>Описание в Swagger</h4><ul class="api">${n.api.map((a) => `<li>
      <span class="method m-${a.method.toLowerCase()}">${a.method}</span>
      <span>${esc(a.summary || a.operationId || '')}${a.docs ? `<br><a href="${esc(a.docs)}" target="_blank" rel="noopener noreferrer">Открыть в Swagger ↗</a>` : ''}</span></li>`).join('')}</ul>`
      : n.kind === 'route' ? '<h4>Описание в Swagger</h4><p class="rel">Этого адреса нет в openapi.json сервиса</p>' : ''}
    ${Object.entries(groups).map(([t, items]) => `<h4>${t} · ${items.length}</h4><ul>${items.join('')}</ul>`).join('') || '<h4>Связей с видимыми слоями нет</h4>'}`;
}

/* ---------- связь «запрос к API»: что уходит в API и что приходит обратно ---------- */

// описания из openapi.json: `код` из Markdown показываем моноширинным
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

// тип поля: string, integer, number (float), array<string>, ProcessRequest, string | null …
function typeOf(s) {
  if (!s) return 'любой';
  if (s.type === 'variants') return s.variants.map(typeOf).join(' | ');
  if (s.type === 'array') return `array<${s.items ? (s.items.ref || typeOf(s.items)) : 'любой'}>`;
  const t = s.type || (s.properties ? 'object' : 'любой');
  return t + (s.format ? ` (${s.format})` : '');
}

// поля схемы строками таблицы; вложенные объекты и элементы массивов — с отступом
function fieldRows(list, depth = 0) {
  return list.map((f) => {
    const notes = [f.constraints, f.enum ? 'значения: ' + f.enum.map((x) => JSON.stringify(x)).join(', ') : null].filter(Boolean).join('; ');
    const children = f.type === 'array' ? f.items?.properties : f.properties;
    return `<tr><td style="padding-left:${depth * 14}px">${depth ? '<span class="rel">└ </span>' : ''}<code>${esc(f.name)}</code>${f.required ? '<span class="rq" title="обязательное">*</span>' : ''}` +
      `${f.description ? `<div class="d">${md(f.description)}</div>` : ''}</td>` +
      `<td class="t">${esc(typeOf(f))}${f.in ? `<div class="c">в ${esc(f.in === 'query' ? 'строке запроса' : f.in === 'path' ? 'адресе' : f.in)}</div>` : ''}${notes ? `<div class="c">${esc(notes)}</div>` : ''}</td></tr>` +
      (children?.length && depth < 5 ? fieldRows(children, depth + 1) : '');
  }).join('');
}

// тело запроса или ответа: тип содержимого, схема полями и пример
function bodyHtml(b) {
  if (!b) return '<p class="rel">Тела нет</p>';
  const s = b.schema;
  const fields = s?.properties?.length ? s.properties
    : s?.type === 'array' && s.items?.properties?.length ? [{ name: '[ ]', type: 'array', items: s.items, description: 'массив элементов' }]
    : null;
  return `<p class="ct">${esc(b.contentType || '')}${s?.ref ? ` · схема <b>${esc(s.ref)}</b>` : ''}${s && !fields ? ` · ${esc(typeOf(s))}` : ''}${s?.description ? ` — ${md(s.description)}` : ''}</p>` +
    (fields ? `<table class="fields">${fieldRows(fields)}</table>` : '') +
    (b.example != null ? `<details class="ex"><summary>Пример</summary><pre>${esc(typeof b.example === 'string' ? b.example : JSON.stringify(b.example, null, 2))}</pre></details>` : '');
}

function contractHtml(op) {
  const req = op.request || { params: [], body: null };
  const ok = (r) => /^2/.test(r.status);
  const response = (r) => `<details class="resp"${ok(r) ? ' open' : ''}><summary><span class="status s${r.status[0]}">${esc(r.status)}</span><span>${md(r.description || '')}</span></summary>
    <div>${bodyHtml(r.body)}</div></details>`;
  return `
    <div class="op"><span class="method m-${op.method.toLowerCase()}">${op.method}</span><span>${esc(op.summary || op.operationId || '')}</span>
      ${op.docs ? `<a href="${esc(op.docs)}" target="_blank" rel="noopener noreferrer">Swagger ↗</a>` : ''}</div>
    <section class="dir" style="--c:${hex(EDGES.api.color)}">
      <h4>→ Запрос · фронтенд → API</h4>
