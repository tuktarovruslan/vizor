      ${req.params.length ? `<p class="ct">Параметры</p><table class="fields">${fieldRows(req.params)}</table>` : ''}
      ${req.body ? bodyHtml(req.body) : `<p class="rel">${req.params.length ? 'Тела нет' : 'Тело и параметры не передаются'}</p>`}
    </section>
    <section class="dir" style="--c:${hex(RESPONSE_COLOR)}">
      <h4>← Ответ · API → фронтенд</h4>
      ${(op.responses || []).map(response).join('') || '<p class="rel">Ответы не описаны</p>'}
    </section>`;
}

function cardHtml(rec) {
  const e = rec.e, from = rec.a.n, route = rec.b.n;
  const project = data.projects.find((p) => p.name === current);
  const handler = project.edges.filter((x) => x.from === route.id && x.kind === 'route').map((x) => project.nodes.find((n) => n.id === x.to)?.label).filter(Boolean);
  // показываем методы, которыми фронтенд вызывает адрес; если их не нашли в описании — все методы адреса
  const ops = route.api || [];
  const used = ops.filter((op) => (e.methods || []).includes(op.method));
  return `
    <div class="ends">
      <span><button data-go="${esc(from.id)}">${esc(from.label)}</button><small>фронтенд · ${esc(from.service)}</small></span>
      <span class="arrows"><span class="q">→ запрос</span><br><span class="a">ответ ←</span></span>
      <span><button data-go="${esc(route.id)}">${esc(route.label)}</button><small>API · ${esc(route.service)}${handler.length ? ' · ' + esc(handler.join(', ')) : ''}</small></span>
    </div>
    <dl>
      <dt>Метод</dt><dd>${esc((e.methods || ['GET']).join(', '))}</dd>
      <dt>Вызов в коде</dt><dd>${esc(from.path)}</dd>
    </dl>
    ${(used.length ? used : ops).map(contractHtml).join('') ||
      `<h4>Структура неизвестна</h4><p class="rel">Адреса ${esc(route.label)} нет в openapi.json сервиса ${esc(route.service)} — опишите его там, и здесь появятся запрос и ответ с типами.</p>`}`;
}

/* Карточки — объекты пространства схемы: связи «запрос к API» (type 'edge') и блока (type 'node').
   Точка карточки в мире = её якорь (середина связи или верх блока) + сдвиг, свой для 2D и 3D.
   Каждый кадр точка проецируется на экран, карточка встаёт туда и чуть масштабируется с расстоянием до камеры;
   тонкая линия тянется от якоря к карточке. Открыто до MAX_CARDS карточек каждого типа; карточки проекта и их
   сдвиги запоминаются в браузере. */
const MAX_CARDS = 5;
const cards = new Map();          // «тип:id» → { key, type, id, el, target, off: { '2d': [x,y,z], '3d': … }, line, sig }
const savedCards = loadPref('cards', {});   // { проект: [{ type, id, off }] }
const cardLines = new THREE.Group();
scene.add(cardLines);
let cardZ = 1, fitDistance = 100, hoveredCard = null, cardDrag = null;
const edgeKey = (r) => r.e.from + '>' + r.e.to;
const apiEdge = (key) => view?.edges.find((r) => r.hit && edgeKey(r) === key) || null;
// цель карточки сервиса — { s: сервис, pl: платформа на слое at }; скрыт слой — берётся любая видимая платформа сервиса
function serviceTarget(id, at) {
  const s = data?.projects.find((p) => p.name === current)?.services.find((x) => x.id === id);
  const pls = view?.platforms.filter((p) => p.service === id) || [];
  const pl = pls.find((p) => p.floor === at) || pls[0];
  return s && pl ? { s, pl } : null;
}
const targetOf = (type, id, at) => (type === 'edge' ? apiEdge(id) : type === 'service' ? serviceTarget(id, at) : view?.nodes.get(id) || null);
const STATUS_COLOR = { up: 0x3ecf7d, down: 0xf0605d, none: 0x9aa3b2 };
const svcStatus = (id) => status[current]?.services.find((x) => x.id === id);
const svcColor = (id) => { const st = svcStatus(id); return !st || st.up === null ? STATUS_COLOR.none : st.up ? STATUS_COLOR.up : STATUS_COLOR.down; };
const CARD_TYPE = {
  edge: { many: 'связей', title: (r) => r.e.label || r.b.n.label, html: (r) => cardHtml(r), color: () => EDGES.api.color,
          sig: (r) => JSON.stringify([r.e, r.b.n.api]), anchor: (r) => r.curve.getPoint(0.5) },
  node: { many: 'блоков', title: (v) => v.n.label, html: (v) => nodeHtml(v), color: (v) => (KINDS[v.n.kind] || KINDS.module).color,
          // «изменён N мин назад» устаревает — раз в минуту карточка перерисовывается
          sig: (v) => JSON.stringify([v.n, v.out.map((e) => [e.to, e.kind, e.label]), v.in.map((e) => [e.from, e.kind, e.label]), Math.floor(Date.now() / 60000)]),
          anchor: (v) => v.anchor.clone() },
  service: { many: 'сервисов', title: (t) => t.s.id, html: (t) => serviceHtml(t), color: (t) => svcColor(t.s.id),
             // состояние и время ответа меняются при каждом опросе статуса, блоки — при перестройке схемы
             sig: (t) => JSON.stringify([t.s, t.pl.floor, svcStatus(t.s.id), serviceStats(t.s.id).sig, Math.floor(Date.now() / 60000)]),
             anchor: (t) => t.pl.group.localToWorld(t.pl.localCenter.clone()),
             // карточка привязана к центру платформы, а выноска выходит из ближайшего к карточке угла или середины стороны
             leaderFrom: (t, r) => platformLeaderPoint(t.pl, r) },
};

// что известно о сервисе по схеме: блоки по слоям, адреса API, связи с другими сервисами, недавние правки
function serviceStats(id) {
  const p = data.projects.find((x) => x.name === current);
  const svcOf = new Map(p.nodes.map((n) => [n.id, n.service]));
  const mine = p.nodes.filter((n) => n.service === id);
  const perFloor = FLOORS.map((f) => ({ f, n: mine.filter((n) => floorOf(n) === f.key).length })).filter((x) => x.n);
  const routes = mine.filter((n) => n.kind === 'route').sort((a, b) => a.label.localeCompare(b.label));
  const out = new Map(), inc = new Map();
  for (const e of p.edges) {
    const a = svcOf.get(e.from), b = svcOf.get(e.to);
    if (!a || !b || a === b) continue;
    if (a === id) out.set(b, (out.get(b) || 0) + 1);
    if (b === id) inc.set(a, (inc.get(a) || 0) + 1);
  }
  for (const l of p.links) {
    if (l.from === id && l.to !== id && !out.has(l.to)) out.set(l.to, 0);
    if (l.to === id && l.from !== id && !inc.has(l.from)) inc.set(l.from, 0);
  }
  const recent = mine.filter((n) => n.mtime && Date.now() - n.mtime < RECENT_MS).length;
  return { mine, perFloor, routes, out, inc, recent, sig: [mine.length, routes.map((r) => r.id + (r.api || []).map((a) => a.method).join()), [...out], [...inc], recent].join('|') };
}

const fmtUptime = (sec) => (sec < 60 ? `${Math.round(sec)} с` : sec < 3600 ? `${Math.round(sec / 60)} мин` : sec < 86400 ? `${Math.round(sec / 3600)} ч` : `${Math.round(sec / 86400)} дн`);

function serviceHtml(t) {
  const s = t.s, st = svcStatus(s.id), x = serviceStats(s.id);
  const stateCls = !st || st.up === null ? '' : st.up ? 'up' : 'down';
  const facts = [
    st ? `<span class="svc-state ${stateCls}"><span class="dot"></span>${svcStateText(st)}</span>` : '<span class="svc-state">статус ещё не получен</span>',
    st?.up && st.ms != null ? `ответ ${st.ms} мс` : '',
    st?.up && st.uptime ? `работает ${fmtUptime(st.uptime)}` : '',
  ].filter(Boolean).join(' · ');
  const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)} ↗</a>`;
  const rel = (map, arrow) => [...map].map(([other, n]) => `<li><span class="sw" style="background:${hex(svcColor(other))};border-radius:50%"></span>${arrow} ${esc(other)} <span class="rel">${n ? n + ' ' + (n === 1 ? 'связь' : n < 5 ? 'связи' : 'связей') : 'по vizor.json'}</span></li>`).join('');
  return `
    <p class="facts">${facts}</p>
    <dl>
      <dt>Тип</dt><dd>${esc(s.type)}</dd>
      ${s.stack ? `<dt>Стек</dt><dd>${esc(s.stack)}</dd>` : ''}
      ${s.url ? `<dt>Адрес</dt><dd>${/^https?:/.test(s.url) ? link(s.url, s.url.replace(/^https?:\/\//, '')) : esc(s.url)}</dd>` : '<dt>Адрес</dt><dd class="rel">не задан — сервис «пока пустой»</dd>'}
      ${s.health ? `<dt>Проверка</dt><dd><code>${esc(s.health)}</code></dd>` : ''}
      ${s.command ? `<dt>Запуск</dt><dd><code>${esc(s.command)}</code></dd>` : ''}
      <dt>Папка</dt><dd><code>${esc(s.dir)}</code></dd>
      ${s.swagger ? `<dt>API</dt><dd>${link(s.swagger, 'Swagger')}</dd>` : ''}
    </dl>
    <h4>Блоки по слоям · ${x.mine.length}</h4>
    <ul class="floors">${x.perFloor.map(({ f, n }) => `<li><span class="sw" style="background:${hex(f.color)}"></span>${f.short}<span class="rel">${n}</span></li>`).join('') || '<li class="rel">блоков нет</li>'}</ul>
    ${x.recent ? `<p class="rel recent-note">изменено за 15 минут: ${x.recent}</p>` : ''}
    ${x.routes.length ? `<h4>Адреса API · ${x.routes.length}</h4><ul class="routes">${x.routes.map((r) => `<li><button data-go="${esc(r.id)}">${(r.api || []).map((a) => `<span class="method m-${a.method.toLowerCase()}">${a.method}</span>`).join('')}<code>${esc(r.label)}</code></button></li>`).join('')}</ul>` : ''}
    ${x.out.size || x.inc.size ? `<h4>Связи с сервисами</h4><ul>${rel(x.out, '→')}${rel(x.inc, '←')}</ul>` : ''}`;
}

function saveCards() {
  savedCards[current] = [...cards.values()].map((c) => ({ type: c.type, id: c.id, off: c.off, size: c.size, ...(c.at ? { at: c.at } : {}) }));
  savePref('cards', savedCards);
  $('closeCards').hidden = !cards.size;
  $('closeCards').textContent = `Закрыть детали (${cards.size})`;
}

function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 2600);
}

function renderCard(c) {
  const t = CARD_TYPE[c.type], sig = t.sig(c.target);
  if (sig === c.sig) return;
  c.sig = sig;
  const body = c.el.querySelector('.card-body'), top = body.scrollTop;
  c.el.querySelector('.card-head b').textContent = c.el.querySelector('.card-head b').title = t.title(c.target);
  c.el.querySelector('.no').style.background = hex(t.color(c.target));
  c.line.material.color.setHex(t.color(c.target));
  body.innerHTML = t.html(c.target);
  body.scrollTop = top;
}

// номера — по порядку открытия, отдельно у карточек связей, блоков и сервисов
function numberCards() {
  for (const type of Object.keys(CARD_TYPE)) {
    [...cards.values()].filter((c) => c.type === type).forEach((c, i) => { c.el.querySelector('.no').textContent = i + 1; });
  }
}

function raiseCard(c) { c.el.style.zIndex = ++cardZ; }

function createCard(type, id, off = {}, size = 1, at = null) {
  const key = type + ':' + id;
  const el = document.createElement('div');
  el.className = 'card card-' + type;
  el.innerHTML = `<div class="card-head" title="Перетащите, чтобы отвести в сторону"><span class="no"></span><b></b>
    <span class="grip" aria-hidden="true">⠿</span>
    <label class="size" title="Размер карточки; двойной щелчок — обычный размер"><span aria-hidden="true">⤡</span>
      <input type="range" min="0.5" max="2" step="0.05" aria-label="Размер карточки"><output></output></label>
    <button class="close" aria-label="Закрыть">×</button></div><div class="card-body"></div>`;
  el.style.visibility = 'hidden';
  $('cards').append(el);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: LEADER_POINTS + 1 }, () => new THREE.Vector3())),
    new THREE.LineBasicMaterial({ color: EDGES.api.color, transparent: true, opacity: 0.55 }));
  line.frustumCulled = false;
  cardLines.add(line);
  const c = { key, type, id, at, el, target: null, off, size, line, sig: '' };
  const range = el.querySelector('.size input'), shown = el.querySelector('.size output');
  const setSize = (v) => { c.size = Number(v); range.value = c.size; shown.textContent = Math.round(c.size * 100) + '%'; };
  setSize(size);
  range.addEventListener('input', () => setSize(range.value));
  range.addEventListener('change', saveCards);
  el.querySelector('.size').addEventListener('dblclick', () => { setSize(1); saveCards(); });
  // Ctrl + колесо над карточкой — размер, как ползунком: щелчок колеса (~100) меняет его примерно на 10 %
  el.addEventListener('wheel', (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();   // иначе браузер масштабирует всю страницу
    setSize(THREE.MathUtils.clamp(c.size * Math.exp(-ev.deltaY * 0.001), 0.5, 2));
    clearTimeout(c.saveTimer);
    c.saveTimer = setTimeout(saveCards, 300);
  }, { passive: false });
  cards.set(key, c);
  el.addEventListener('pointerdown', () => raiseCard(c));
  el.addEventListener('pointerenter', () => { hoveredCard = c; applyHighlight(); });
  el.addEventListener('pointerleave', () => { if (hoveredCard === c) { hoveredCard = null; applyHighlight(); } });
  el.addEventListener('click', (ev) => {
    const go = ev.target.closest('[data-go]');
    const link = ev.target.closest('[data-link]');
    if (ev.target.closest('.close')) closeCard(key);
    else if (link) { const rec = apiEdge(link.dataset.link); if (rec) openCard('edge', rec); }
    else if (go) focusNode(go.dataset.go);
  });
  el.querySelector('.card-head').addEventListener('pointerdown', (ev) => startCardDrag(ev, c));
  raiseCard(c);
  return c;
}

function closeCard(key) {
  const c = cards.get(key);
  if (!c) return;
  c.el.remove();
  cardLines.remove(c.line);
  c.line.geometry.dispose(); c.line.material.dispose();
  cards.delete(key);
  if (hoveredCard === c) hoveredCard = null;
  numberCards();
  saveCards();
  applyHighlight();
}

// клик по связи, блоку или сервису: открыть карточку; уже открытую — поднять и мигнуть; шестая того же типа закрывает самую раннюю.
// Карточка сервиса одна на сервис; клик по его платформе на другом слое переносит её туда.
function openCard(type, target) {
  const id = type === 'edge' ? edgeKey(target) : type === 'service' ? target.s.id : target.n.id;
  let c = cards.get(type + ':' + id);
  if (c && type === 'service' && c.at !== target.pl.floor) {
    c.at = target.pl.floor;
    c.target = target;
    c.off = {};   // новая привязка — место рядом с ней подбирается заново
    saveCards();
  }
  if (!c) {
    const same = [...cards.values()].filter((x) => x.type === type);
    if (same.length >= MAX_CARDS) {
      const oldest = same[0];
      toast(`Открыто не больше ${MAX_CARDS} карточек ${CARD_TYPE[type].many} — закрыл самую раннюю: ${oldest.target ? CARD_TYPE[type].title(oldest.target) : oldest.id}`);
      closeCard(oldest.key);
    }
    c = createCard(type, id, {}, 1, type === 'service' ? target.pl.floor : null);
    c.target = target;
    renderCard(c);
    numberCards();
    saveCards();
  }
  raiseCard(c);
  c.el.classList.remove('flash'); void c.el.offsetWidth; c.el.classList.add('flash');
  applyHighlight();
}

// после перестройки схемы карточки находят свою связь или блок заново; скрыт слоем — карточка прячется до его возвращения
function bindCards() {
  for (const c of cards.values()) {
    c.target = targetOf(c.type, c.id, c.at);
    if (c.target) renderCard(c);
  }
}
// при смене проекта — карточки этого проекта из сохранённых
function restoreCards() {
  for (const key of [...cards.keys()]) { const c = cards.get(key); c.el.remove(); cardLines.remove(c.line); cards.delete(key); }
  // старый формат { key, off } — карточки связей
  const saved = (savedCards[current] || []).map((s) => (s.type ? s : { type: 'edge', id: s.key, off: s.off }));
  for (const type of Object.keys(CARD_TYPE)) for (const s of saved.filter((x) => x.type === type).slice(-MAX_CARDS)) createCard(type, s.id, s.off || {}, s.size || 1, s.at || null);
  bindCards();
  numberCards();
  saveCards();
}

const cardMid = (c) => CARD_TYPE[c.type].anchor(c.target);
const cardScale = (p) => THREE.MathUtils.clamp(fitDistance / camera.position.distanceTo(p), 0.6, 1);
function toScreen(p) {
  const v = p.clone().project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, behind: v.z > 1 };
}
// точка экрана → мир, на плоскости через point, развёрнутой к камере (своя плоскость: dragPlane занят перетаскиванием блока)
const cardPlane = new THREE.Plane();
function screenToPlane(x, y, point) {
  pointer.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  cardPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), point);
  return ray.ray.intersectPlane(cardPlane, new THREE.Vector3());
}

// Выноска от якоря к карточке — плавная кривая. Входит в ту сторону карточки, что обращена к якорю
// (по большему зазору: слева/справа или сверху/снизу), в ближайшую к якорю точку этой стороны, перпендикулярно ей.
const LEADER_POINTS = 40;
const tmpLeader = new THREE.Vector3();
// Точка выхода выноски у платформы: из 4 углов (на скруглении, под 45°) и 4 середин сторон верхней грани —
// та, что на экране ближе всего к прямоугольнику карточки r
function platformLeaderPoint(pl, r) {
  const { x0, x1, z0, z1 } = pl.rect;
  const k = Math.min(CORNER.platform, (x1 - x0) / 2, (z1 - z0) / 2) * (1 - Math.SQRT1_2);   // отступ точки на дуге угла
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const candidates = [[x0 + k, z0 + k], [x1 - k, z0 + k], [x1 - k, z1 - k], [x0 + k, z1 - k], [cx, z0], [x1, cz], [cx, z1], [x0, cz]];
  let best = null, bestD = Infinity;
  for (const [x, z] of candidates) {
    const w = pl.group.localToWorld(new THREE.Vector3(x, 0, z));
    const q = toScreen(w);
    const d = Math.hypot(Math.max(r.x0 - q.x, 0, q.x - r.x1), Math.max(r.y0 - q.y, 0, q.y - r.y1));
    if (d < bestD) { bestD = d; best = w; }
  }
  return best;
}

function leaderCurve(c, anchor, wp, p) {
  const s = cardScale(wp) * c.size;
  const r = { x0: p.x, y0: p.y, x1: p.x + c.el.offsetWidth * s, y1: p.y + c.el.offsetHeight * s };
  const mid = CARD_TYPE[c.type].leaderFrom?.(c.target, r) || anchor;
  const a = toScreen(mid);
  const gapX = Math.max(r.x0 - a.x, a.x - r.x1, 0), gapY = Math.max(r.y0 - a.y, a.y - r.y1, 0);
  if (!gapX && !gapY) return null;   // якорь под карточкой — линия не нужна
  const inset = 18 * s;
  const clampY = THREE.MathUtils.clamp(a.y, r.y0 + inset, Math.max(r.y0 + inset, r.y1 - inset));
  const clampX = THREE.MathUtils.clamp(a.x, r.x0 + inset, Math.max(r.x0 + inset, r.x1 - inset));
  let at;
  if (gapX >= gapY) at = a.x < r.x0 ? [r.x0, clampY, -1, 0] : [r.x1, clampY, 1, 0];
  else at = a.y < r.y0 ? [clampX, r.y0, 0, -1] : [clampX, r.y1, 0, 1];
  // насколько далеко кривая выходит из стороны перпендикулярно: половина зазора, но не меньше 30 и не больше 160 px
  const reach = THREE.MathUtils.clamp(Math.max(gapX, gapY) * 0.5, 30, 160);
  const end = screenToPlane(at[0], at[1], wp);
  const out = screenToPlane(at[0] + at[2] * reach, at[1] + at[3] * reach, wp);
  if (!end || !out) return null;
  return new THREE.CubicBezierCurve3(mid, mid.clone().lerp(out, 0.4), out, end);
}

// Место по умолчанию: справа от схемы (если там тесно — слева, иначе у края экрана) на высоте связи,
// ниже уже открытых карточек, чтобы не накрывать их
function autoPlace(c) {
  const mid = cardMid(c);
  const s = cardScale(mid) * c.size;
  const w = c.el.offsetWidth * s, h = c.el.offsetHeight * s;
  const sr = { x0: Infinity, x1: -Infinity };
  const box = new THREE.Box3().setFromObject(world);
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = toScreen(new THREE.Vector3(x, y, z));
    sr.x0 = Math.min(sr.x0, p.x); sr.x1 = Math.max(sr.x1, p.x);
  }
  const top = $('top').getBoundingClientRect().bottom + 12;
  const xMax = innerWidth - 12 - w;
  let x0 = sr.x1 + 32;
  if (x0 > xMax) x0 = sr.x0 - 32 - w >= 12 ? sr.x0 - 32 - w : xMax;
  const y0 = THREE.MathUtils.clamp(toScreen(mid).y - 40, top, Math.max(top, innerHeight - 12 - h));
  // свободное место ищем колонками: от выбранной — поочерёдно влево и вправо, но только в пределах экрана
  const others = [...cards.values()].filter((o) => o !== c && o.placed).map((o) => o.el.getBoundingClientRect())
    .concat(['legend', 'recent', 'legendBtn', 'settingsBtn', 'settings'].map((id) => $(id).getBoundingClientRect()).filter((r) => r.width && r.height));
  // длинная карточка может уходить за нижний край (её тело прокручивается) — важно, чтобы было видно хотя бы MIN_SEEN
  const MIN_SEEN = 240;
  const seen = (y) => Math.min(h, innerHeight - 12 - y);
  const clash = (x, y) => others.find((r) => x < r.right + 12 && x + w > r.left - 12 && y < r.bottom + 12 && y + seen(y) > r.top - 12);
  const cols = [x0];
  for (let k = 1; k < 8; k++) cols.push(x0 - k * (w + 16), x0 + k * (w + 16));
  let spot = null;
  for (const x of cols.filter((x) => x >= 12 && x <= xMax)) {
    for (let y = y0, i = 0; i < 8 && seen(y) >= MIN_SEEN && !spot; i++) {
      const hit = clash(x, y);
      if (!hit) spot = [x, y]; else y = hit.bottom + 12;
    }
    if (spot) break;
    for (let y = top, i = 0; i < 8 && seen(y) >= MIN_SEEN && !spot; i++) {
      const hit = clash(x, y);
      if (!hit) spot = [x, y]; else y = hit.bottom + 12;
    }
    if (spot) break;
  }
  // места нет — лесенкой от последней открытой карточки
  const last = [...cards.values()].filter((o) => o !== c && o.placed).pop()?.el.getBoundingClientRect();
  const [x, y] = spot || (last ? [Math.min(last.left + 28, xMax), Math.min(last.top + 28, innerHeight - 12 - MIN_SEEN)] : [Math.min(x0, xMax), y0]);
  const p = screenToPlane(x, y, mid);
  if (p) c.off[mode] = p.sub(mid).toArray();
  saveCards();
}

function startCardDrag(ev, c) {
  if (ev.button !== 0 || ev.target.closest('.close, .size') || !c.target || !c.off[mode]) return;
  ev.preventDefault();
  const wp = cardMid(c).add(new THREE.Vector3().fromArray(c.off[mode]));
  const hit = screenToPlane(ev.clientX, ev.clientY, wp);
  if (!hit) return;
  cardDrag = { c, grab: hit.sub(wp), point: wp };
  c.el.classList.add('dragging');
  ev.currentTarget.setPointerCapture(ev.pointerId);
}
addEventListener('pointermove', (ev) => {
  if (!cardDrag) return;
  const { c, grab, point } = cardDrag;
  const hit = screenToPlane(ev.clientX, ev.clientY, point);
  if (hit) c.off[mode] = hit.sub(grab).sub(cardMid(c)).toArray();
});
function endCardDrag() {
  if (!cardDrag) return;
  cardDrag.c.el.classList.remove('dragging');
  cardDrag = null;
  saveCards();
}
addEventListener('pointerup', endCardDrag);
addEventListener('pointercancel', endCardDrag);

// каждый кадр: карточки — к своим точкам в пространстве, линии — от середины связи к карточке
function updateCards() {
  for (const c of cards.values()) {
    const show = !!c.target && !!world;
    if (show && !c.off[mode] && !flight) autoPlace(c);
    c.placed = show && !!c.off[mode];
    c.line.visible = false;
    if (!c.placed) { c.el.style.visibility = 'hidden'; continue; }
    const mid = cardMid(c);
    const wp = mid.clone().add(new THREE.Vector3().fromArray(c.off[mode]));
    const p = toScreen(wp);
    c.el.style.visibility = p.behind ? 'hidden' : '';
    c.el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${cardScale(wp) * c.size})`;
    const curve = p.behind ? null : leaderCurve(c, mid, wp, p);
    if (curve) {
      const pos = c.line.geometry.attributes.position;
      for (let i = 0; i <= LEADER_POINTS; i++) { curve.getPoint(i / LEADER_POINTS, tmpLeader); pos.setXYZ(i, tmpLeader.x, tmpLeader.y, tmpLeader.z); }
      pos.needsUpdate = true;
      c.line.visible = true;
    }
    c.el.classList.toggle('hl', c.type === 'edge' ? hoveredEdge === c.target : c.type === 'service' ? hoverGroup?.pl === c.target.pl : hovered === c.id);
  }
}
$('closeCards').onclick = () => { for (const key of [...cards.keys()]) closeCard(key); };

// Esc закрывает верхнюю карточку
function closeTopCard() {
  const top = [...cards.values()].sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
  if (top) closeCard(top.key);
}
function setRecentCollapsed(on) {

  $('recentToggle').setAttribute('aria-expanded', String(!on));
  savePref('recentCollapsed', on);
}
setRecentCollapsed(loadPref('recentCollapsed', false));
$('recentToggle').addEventListener('click', () => setRecentCollapsed(!$('recent').classList.contains('collapsed')));
$('recentList').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) focusNode(go.dataset.go);
});
$('home').onclick = () => fitCamera();

const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
function pick(ev) {
  if (!view) return null;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects([...view.nodes.values()].map((v) => v.mesh), false)[0];
  return hit?.object.userData.id || null;
}
// связь «запрос к API» под курсором; вызывается после pick — луч уже выставлен
function pickEdge() {
  if (!view) return null;
  const hit = ray.intersectObjects(view.edges.filter((r) => r.hit).map((r) => r.hit), false)[0];
  return hit?.object.userData.edge || null;
}
// смысловая группа под курсором — папка (плитка) или сервис (платформа); вызывается после pick — луч уже выставлен.
// Слой целиком берётся за заголовок (см. buildFloor): пустое место этажа остаётся для управления камерой.
function pickGroup() {
  if (!view) return null;
  const targets = [];
  for (const pl of view.platforms) {
    if (pl.clusters.length) targets.push(pl.slab);
    for (const cr of pl.clusters) if (cr.tile) targets.push(cr.tile);
  }
  return ray.intersectObjects(targets, false)[0]?.object.userData.group || null;
}

// блоки группы — их и двигает перетаскивание
function groupMembers(g) {
  const ids = g.type === 'cluster' ? g.cr.ids
    : g.type === 'platform' ? g.pl.clusters.flatMap((cr) => cr.ids)
    : g.floor.plats.flatMap((pl) => pl.clusters.flatMap((cr) => cr.ids));
  return ids.map((id) => view.nodes.get(id)).filter(Boolean);
}

// платформа светлее, когда под курсором или когда у сервиса открыта карточка, привязанная к ней
function paintPlatform(pl, hover = hoverGroup?.type === 'platform' && hoverGroup.pl === pl) {
  const c = cards.get('service:' + pl.service);
  const on = hover || (!!c && c.target?.pl === pl);
  fadeColorTo(pl.slab.material, on ? 0x3a5684 : 0x1b2230);
  fadeTo(pl.slab.material, on ? 0.95 : 0.85);
  drawTag(pl.tag, { hover, open: !!c && c.target?.pl === pl });
}

// подсветка группы под курсором: плитка, платформа или плоскость слоя светлее, подпись выделена
let hoverGroup = null;
const sameGroup = (a, b) => a === b || (!!a && !!b && a.type === b.type && (a.cr || a.pl || a.floor) === (b.cr || b.pl || b.floor));
function setHoverGroup(g) {
  if (sameGroup(g, hoverGroup)) return;
  const paint = (x, on) => {
    if (!x) return;
    if (x.type === 'cluster') {
      fadeColorTo(x.cr.tile.material, on ? 0x3d5378 : 0x2a3446);
      fadeTo(x.cr.tile.material, on ? 0.85 : 0.55);
      x.cr.label?.element.classList.toggle('grab-hl', on);
    } else if (x.type === 'platform') {
      paintPlatform(x.pl, on);
    } else {
      fadeTo(x.floor.plane.material, on ? 0.16 : x.floor.plane.userData.planeOpacity);
      fadeTo(x.floor.border.material, on ? 0.9 : 0.4);
      x.floor.label.element.classList.toggle('grab-hl', on);
    }
  };
  paint(hoverGroup, false);
  hoverGroup = g;
  paint(hoverGroup, true);
}

/* перетаскивание блока: он скользит по плоскости своего этажа (в 3D — горизонтально, в 2D — по экрану).
   Так же перетаскиваются группы — папка, сервис, слой: все их блоки сдвигаются вместе, соседи отъезжают.
   Слушатель на родителе в фазе захвата срабатывает раньше OrbitControls и отключает вращение/сдвиг камеры. */
const DRAG_START_PX = 4;
let drag = null;
const dragPlane = new THREE.Plane();
const tmpQ = new THREE.Quaternion();
function planeHit(ev, out) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  return ray.ray.intersectPlane(dragPlane, out);
}
// начать перетаскивание группы: точка захвата — на плоскости её этажа
function startGroupDrag(ev, g) {
  if (ev.button !== 0 || !view) return;
  const frame = g.floor;
  const normal = new THREE.Vector3(0, 1, 0).applyQuaternion(frame.g.getWorldQuaternion(tmpQ));
  dragPlane.setFromNormalAndCoplanarPoint(normal, frame.g.localToWorld(new THREE.Vector3()));
  const hit = planeHit(ev, new THREE.Vector3());
  if (!hit) return;
  ev.preventDefault();
  if (g.type === 'floor') ev.stopPropagation();
  const members = groupMembers(g);
  drag = { group: g, frame, members, start: members.map((u) => [u.raw.x, u.raw.z]), base0: frame.base,
           from: frame.g.worldToLocal(hit), x0: ev.clientX, y0: ev.clientY, lx: ev.clientX, ly: ev.clientY, moving: false };
  setHoverGroup(g);
  controls.enabled = false;
  ev.target.setPointerCapture?.(ev.pointerId);
}

$('scene').addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  const id = pick(ev);
  if (!id) {
    if (pickEdge()) return;   // связь — только клик
    const g = pickGroup();
    if (g) startGroupDrag(ev, g);
    return;
  }
  const v = view.nodes.get(id);
  const normal = new THREE.Vector3(0, 1, 0).applyQuaternion(v.group.getWorldQuaternion(tmpQ));
  dragPlane.setFromNormalAndCoplanarPoint(normal, v.base);
  const hit = planeHit(ev, new THREE.Vector3());
  if (!hit) return;
  drag = { id, v, frame: v.frame, members: [v], grab: hit.sub(v.base), x0: ev.clientX, y0: ev.clientY, moving: false };
  controls.enabled = false;
  renderer.domElement.setPointerCapture(ev.pointerId);
}, { capture: true });

function moveDragged(ev) {
  if (!drag.moving && Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) < DRAG_START_PX) return;
  drag.moving = true;
  renderer.domElement.style.cursor = 'grabbing';
  document.body.style.cursor = 'grabbing';
  if (drag.group?.type === 'floor') drag.frame.label.element.classList.add('dragging');
  const hit = planeHit(ev, new THREE.Vector3());
  if (!hit) return;
  if (drag.group) {
    // группа: все её блоки сдвигаются на одно и то же смещение; у слоя вместе с ними едет и его рамка
    const d = drag.frame.g.worldToLocal(hit).sub(drag.from);
    drag.members.forEach((u, i) => { u.raw.x = drag.start[i][0] + d.x; u.raw.z = drag.start[i][1] + d.z; });
    if (drag.group.type === 'floor') drag.frame.base = moveRect(drag.base0, [d.x, d.z]);
  } else {
    const local = drag.v.group.worldToLocal(hit.sub(drag.grab));
    drag.v.raw.x = local.x;
    drag.v.raw.z = local.z;
  }
  // тащимое встаёт под курсор, соседние папки и платформы отъезжают; связи перекладываются у всех сдвинутых
  const moved = fitFrames(drag.frame, drag.members[0]?.n.id ?? null);
  if (mode === '2d') restackFloors(drag.frame);
  for (const rec of view.edges) if (moved.has(rec.a) || moved.has(rec.b) || rec.e.kind === 'service') refreshEdge(rec);
}

function endDrag() {
  if (!drag) return;
  const { frame, members, group, moving } = drag;
  drag = null;
  controls.enabled = true;
  renderer.domElement.style.cursor = 'grab';
  document.body.style.cursor = '';
  frame.label.element.classList.remove('dragging');
  if (!moving) return;
  // запоминаем места всех блоков этажа, которые сдвинулись (и тащимые, и отъехавшие соседи); у слоя — ещё сдвиг рамки
  const saved = (offsets[current] ||= {});
  const dragged = new Set(members);
  for (const u of view.nodes.values()) {
    if (u.frame !== frame) continue;
    const dx = u.localBase.x - u.auto[0], dz = u.localBase.z - u.auto[1];
    if (dragged.has(u) || Math.abs(u.localBase.x - u.raw.x) > 1e-6 || Math.abs(u.localBase.z - u.raw.z) > 1e-6) saved[u.n.id] = [dx, dz];
    u.raw.x = u.localBase.x;
    u.raw.z = u.localBase.z;
  }
  if (group?.type === 'floor') saved['floor:' + frame.key] = [frame.base.x0 - frame.defaultBase.x0, frame.base.z0 - frame.defaultBase.z0];
  fitFrames(frame);
  savePref('offsets', offsets);
  $('resetLayout').disabled = false;
}

renderer.domElement.addEventListener('pointermove', (ev) => {
  if (drag) return;
  const id = pick(ev);
  const edge = id ? null : pickEdge();
  const group = id || edge ? null : pickGroup();
  setHoverGroup(group);
  renderer.domElement.style.cursor = id || group ? 'grab' : edge ? 'pointer' : '';
  if (id !== hovered || edge !== hoveredEdgeOnScene) { hovered = id; hoveredEdgeOnScene = edge; applyHighlight(); }
});
// перетаскивание слушаем на всём окне: курсор может уйти на панель, а отпустить блок можно где угодно
addEventListener('pointermove', (ev) => { if (drag) { drag.lx = ev.clientX; drag.ly = ev.clientY; moveDragged(ev); } });
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
addEventListener('blur', endDrag);
// Пока слой зажат ЛКМ за название: колесо — поворот вокруг его оси X, Shift + колесо — вокруг оси Z,
// Alt + колесо — вокруг оси Y (оси самого слоя, через его текущий центр);
// W / S — от себя / к себе, A / D — влево / вправо (по горизонтали относительно камеры), пробел / C — выше / ниже.
// Колесо слушаем на всём окне в фазе захвата: курсор над названием слоя, а не над сценой.
const FLOOR_ROT_PER_DELTA = THREE.MathUtils.degToRad(0.075);   // щелчок колеса (~100) — 7.5°
const FLOOR_MOVE_STEP = 2;
const heldFloor = () => (drag?.group?.type === 'floor' ? drag.frame : null);
function transformFloor(f, change) {
  Object.assign(f.tf, change(f.tf));
  placeFloor(f);
  refreshFloors(new Set([f]));
  (offsets[current] ||= {})['floorT:' + f.key] = [...f.tf.rot.toArray(), ...f.tf.shift.toArray()];
  savePref('offsets', offsets);
  $('resetLayout').disabled = false;
  rebaseDrag();
}
// слой повернулся или поднялся под курсором — перетаскивание продолжается от нового положения без скачка
function rebaseDrag() {
  const { frame } = drag;
  frame.g.updateMatrixWorld(true);
  dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0).applyQuaternion(frame.g.getWorldQuaternion(tmpQ)), frame.g.localToWorld(new THREE.Vector3()));
  const hit = planeHit({ clientX: drag.lx, clientY: drag.ly }, new THREE.Vector3());
  if (!hit) return;
  drag.from = frame.g.worldToLocal(hit);
  drag.start = drag.members.map((u) => [u.raw.x, u.raw.z]);
  drag.base0 = frame.base;
}
addEventListener('wheel', (ev) => {
  const f = heldFloor();
  if (!f) return;
  ev.preventDefault();
  ev.stopPropagation();
  const delta = ev.deltaY || ev.deltaX;   // Chrome при Shift отдаёт прокрутку в deltaX
  if (!delta) return;
  const angle = -delta * FLOOR_ROT_PER_DELTA;
  transformFloor(f, () => rotateFloor(f, ev.altKey ? AXIS_Y : ev.shiftKey ? AXIS_Z : AXIS_X, angle));
}, { capture: true, passive: false });
// Alt, пока слой зажат, не отдаём браузеру: на Windows отпускание Alt переводит фокус на меню окна
addEventListener('keyup', (ev) => { if (heldFloor() && ev.key === 'Alt') ev.preventDefault(); });

// направления «от себя» и «вправо» — по горизонтали относительно камеры; клавиши — по физическому положению (любая раскладка)
function floorMoveDir(code) {
  const forward = camera.getWorldDirection(new THREE.Vector3()).setY(0);
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);   // камера смотрит строго вниз
  forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, AXIS_Y).normalize();
  return { KeyW: forward, KeyS: forward.clone().negate(), KeyD: right, KeyA: right.clone().negate(),
           Space: AXIS_Y.clone(), KeyC: AXIS_Y.clone().negate() }[code] || null;
}
addEventListener('keydown', (ev) => {
  const f = heldFloor();
  if (f && ev.key === 'Alt') { ev.preventDefault(); return; }
  const dir = f && floorMoveDir(ev.code);
  if (!dir) return;
  ev.preventDefault();   // пробел иначе прокрутил бы страницу или нажал кнопку в фокусе
  transformFloor(f, (t) => ({ shift: t.shift.clone().addScaledVector(dir, FLOOR_MOVE_STEP) }));
});

$('resetLayout').onclick = () => {
  delete offsets[current];
  savePref('offsets', offsets);
  rebuild(false);
};
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  const id = pick(ev);
  const edge = id ? null : pickEdge();
  const pl = id || edge ? null : pickGroup()?.pl;
  if (pl) {
    // повторный клик по той же платформе закрывает карточку сервиса, по другой его платформе — переносит её туда
    const c = cards.get('service:' + pl.service);
    const s = data.projects.find((p) => p.name === current).services.find((x) => x.id === pl.service);
    if (c && c.target?.pl === pl) closeCard(c.key); else if (s) openCard('service', { s, pl });
    return;
  }
  // повторный клик по элементу с открытой карточкой закрывает её
  const key = edge ? 'edge:' + edgeKey(edge) : id ? 'node:' + id : null;
  if (key && cards.has(key)) closeCard(key);
  else if (edge) openCard('edge', edge); else if (id) openCard('node', view.nodes.get(id));
});
// Esc: сначала закрывает открытую панель настроек, иначе — верхнюю карточку
addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  setLegendOpen(false);
  if (!$('settings').hidden) setSettingsOpen(false); else closeTopCard();
});

// «Как читать схему» по умолчанию свёрнуто; на широком экране раскрытие запоминается
$('legendDetails').open = loadPref('legendOpen', false);
$('legendDetails').addEventListener('toggle', () => {
  if (getComputedStyle($('legendBtn')).display === 'none') savePref('legendOpen', $('legendDetails').open);
});

// на узком экране легенда открывается значком и закрывается им же, кликом мимо или Esc
function setLegendOpen(on) {
  $('legend').classList.toggle('open', on);
  $('legendBtn').setAttribute('aria-expanded', String(on));
  if (!on) { $('legend').style.bottom = $('legend').style.maxHeight = ''; return; }
  $('legend').querySelector('details').open = true;
  // над значком и плашкой «Недавно изменено» (её высота меняется), но не выше верхней панели
  const floor = Math.min($('recent').getBoundingClientRect().top, $('legendBtn').getBoundingClientRect().top);
  $('legend').style.bottom = innerHeight - floor + 8 + 'px';
  $('legend').style.maxHeight = Math.max(160, floor - $('top').getBoundingClientRect().bottom - 16) + 'px';
}
// стал широкий экран — значка нет, легенда снова постоянная на своём месте
addEventListener('resize', () => { if ($('legend').classList.contains('open')) setLegendOpen(getComputedStyle($('legendBtn')).display !== 'none'); });
$('legendBtn').addEventListener('click', () => setLegendOpen(!$('legend').classList.contains('open')));
addEventListener('pointerdown', (ev) => { if (!ev.target.closest('#legend, #legendBtn')) setLegendOpen(false); });

/* ---------- бизнес-логика без документации ---------- */

// Элемент этажа «Бизнес-логика» без одноимённого .md пульсирует красным размытым свечением — в том же стиле, что подсветка
// открытого блока (та же текстура по форме основания), шире кольца «недавнего», чтобы были видны оба.
// Свечение плотно к блоку обычного размера (круг радиусом ~1.45, квадрат с полустороной ~1.1) и приглушённое —
// иначе свечения соседних блоков сливаются в одно пятно
function updateDocAlerts() {
  if (!view) return;
  for (const v of view.nodes.values()) {
    v.noDoc = v.floor === 'logic' && !v.n.doc;
    if (v.noDoc && !v.docRing) {
      const round = ROUND_SHAPES.has((KINDS[v.n.kind] || KINDS.module).shape);
      v.docRing = new THREE.Mesh(GLOW_PLANE, new THREE.MeshBasicMaterial({ color: 0xf0605d, map: glowTexture(round), transparent: true,
        side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
      v.docRing.userData.base = round ? 0.78 : 0.68;
      v.docRing.rotation.x = -Math.PI / 2;
      v.docRing.position.copy(v.localBase).setY(0.05);
      v.docRing.renderOrder = 5;
      v.group.add(v.docRing);
    } else if (!v.noDoc && v.docRing) {
      v.group.remove(v.docRing); v.docRing.material.dispose(); v.docRing = null;   // плоскость и текстура общие
      v.mesh.material.emissive.setHex(v.recent ? 0x5a4a00 : 0x000000);
    }
  }
}

/* ---------- недавние изменения ---------- */

function updateRecent() {
  if (!view) return;
  const now = Date.now();
  const list = [...view.nodes.values()].filter((v) => v.n.mtime && now - v.n.mtime < RECENT_MS).sort((a, b) => b.n.mtime - a.n.mtime);
  for (const v of view.nodes.values()) {
    const recent = list.includes(v);
    v.label.element.classList.toggle('recent', recent);
    if (recent && !v.ring) {
      v.ring = new THREE.Mesh(new THREE.RingGeometry(1.3, 1.55, 32), new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      v.ring.rotation.x = -Math.PI / 2;
      v.ring.position.copy(v.localBase).setY(0.06);
      v.group.add(v.ring);
    } else if (!recent && v.ring) {
      v.group.remove(v.ring); v.ring.geometry.dispose(); v.ring.material.dispose(); v.ring = null;
    }
    v.recent = recent;
    if (!v.noDoc) v.mesh.material.emissive.setHex(recent ? 0x5a4a00 : 0x000000);
  }
  $('recentCount').textContent = list.length;
  $('recentCount').classList.toggle('has', list.length > 0);
  $('recentList').innerHTML = list.length
    ? list.slice(0, 30).map((v) => `<li><button data-go="${esc(v.n.id)}"><span class="sw" style="background:${hex((KINDS[v.n.kind] || KINDS.module).color)}"></span><span class="name">${esc(v.n.label)}</span><span class="ago">${ago(v.n.mtime)}</span></button></li>`).join('')
    : '<li class="empty">за последние 15 минут ничего</li>';
}

/* ---------- статус сервисов ---------- */

function applyStatus() {
  if (!view) return;
  const p = status[current];
  for (const pl of view.platforms) {
    const s = p?.services.find((x) => x.id === pl.service);
    const state = !s || s.up === null ? '' : s.up ? 'up' : 'down';
    pl.outline.material.color.setHex(state === 'up' ? 0x3ecf7d : state === 'down' ? 0xf0605d : 0x6b7587);
    drawTag(pl.tag, { state });
  }
  for (const c of cards.values()) if (c.type === 'service' && c.target) renderCard(c);
}

const svcStateText = (s) => (s.up === null ? 'пока пустой' : s.up ? 'работает' : 'не запущен');

async function pollStatus() {
  try {
    const st = await (await fetch('/api/status', { cache: 'no-store' })).json();
    status = Object.fromEntries(st.projects.map((p) => [p.name, p]));
    applyStatus();
  } catch { /* vizor перезапускается */ }
}

/* ---------- панель: проекты, вид, слои ---------- */

function renderControls() {
  $('tabs').innerHTML = data.projects.map((p) => `<button class="chip" data-p="${esc(p.name)}" aria-pressed="${p.name === current}">${esc(p.name)}</button>`).join('');
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('resetLayout').disabled = !Object.keys(offsets[current] || {}).length;
  const p = data.projects.find((x) => x.name === current);
  const off = hiddenSvc();
  const counts = Object.fromEntries(FLOORS.map((f) => [f.key, 0]));
  for (const n of p?.nodes || []) if (!off.has(n.service)) counts[floorOf(n)]++;
  const perSvc = {};
  for (const n of p?.nodes || []) perSvc[n.service] = (perSvc[n.service] || 0) + 1;
  $('services').innerHTML = '<span class="cap">Сервисы:</span>' + (p?.services || []).map((s) =>
    `<button class="layer" data-svc="${esc(s.id)}" aria-pressed="${!off.has(s.id)}" style="--c:#9aa3b2" title="${esc(s.stack || s.type)}">` +
    `<span class="box"></span>${esc(s.id)} <span class="n">${perSvc[s.id] || 0}</span></button>`).join('');
  $('layers').innerHTML = '<span class="cap">Слои:</span>' + FLOORS.map((f) =>
    `<button class="layer" data-layer="${f.key}" aria-pressed="${shown.has(f.key)}" style="--c:${hex(f.color)}" title="${f.sub}">` +
    `<span class="box"></span>${f.short} <span class="n">${counts[f.key]}</span></button>`).join('');
}

function rebuild(refit) {
  signature = '';
  hoverGroup = null;
  hovered = hoveredEdge = hoveredEdgeOnScene = null;
  show();
  if (refit) fitCamera();
}

$('tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-p]');
  if (!b || b.dataset.p === current) return;
  current = b.dataset.p;
  savePref('project', current);
  location.hash = encodeURIComponent(current);
  rebuild(true);
});
$('modeSeg').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-mode]');
  if (!b || b.dataset.mode === mode) return;
  mode = b.dataset.mode;
  savePref('mode', mode);
  applyControls();
  rebuild(true);
});
$('services').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-svc]');
  if (!b) return;
  const p = data.projects.find((x) => x.name === current);
  const off = hiddenSvc();
  const id = b.dataset.svc;
  // последний видимый сервис не скрываем, иначе схема опустеет
  if (off.has(id)) off.delete(id); else if (p.services.length - off.size > 1) off.add(id);
  hiddenServices[current] = [...off];
  savePref('hiddenServices', hiddenServices);
  rebuild(true);
});
$('layers').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-layer]');
  if (!b) return;
  const k = b.dataset.layer;
  if (shown.has(k)) { if (shown.size > 1) shown.delete(k); } else shown.add(k);
  savePref('layers', [...shown]);
  rebuild(true);
});

/* ---------- данные архитектуры ---------- */

function show() {
  renderControls();
  const p = data.projects.find((x) => x.name === current);
  if (!p) return;
  // структура меняется → перестроить сцену; меняется только время правки → обновить подсветку
  // структуру сравниваем без учёта порядка узлов и связей
  const sig = current + JSON.stringify([p.services, p.links, p.nodes.map((n) => n.id + n.kind).sort(), p.edges.map((e) => e.from + '>' + e.to + e.kind).sort()]);
  // пока блок тащат, схему не перестраиваем — перестроим на следующем опросе
  if (sig !== signature && drag) return;
  if (sig !== signature) {
    const first = !signature && !world;
    signature = sig;
    hoveredEdge = hoveredEdgeOnScene = null;
    build(p);
    if (cardsOf !== current) { cardsOf = current; restoreCards(); } else bindCards();
    applyHighlight();
    if (first) fitCamera();
    // /?node=<id>#проект — сразу открыть элемент (ссылка на элемент схемы, например с вики)
    if (nodeParam && view.nodes.has(nodeParam)) { focusNode(nodeParam); nodeParam = null; }
  } else {
    for (const n of p.nodes) { const v = view.nodes.get(n.id); if (v) v.n = n; }
    // описание адреса в openapi.json могло поменяться — свежие данные связи из нового ответа
    for (const r of view.edges) if (r.hit) r.e = p.edges.find((e) => e.from === r.e.from && e.to === r.e.to && e.kind === 'api') || r.e;
    bindCards();
    applyHighlight();
  }
  updateDocAlerts();
  updateRecent();
  applyStatus();
  applyHighlight();
}

async function pollArchitecture() {
  try {
    data = await (await fetch('/api/architecture', { cache: 'no-store' })).json();
  } catch {
    $('updated').textContent = 'vizor недоступен';
    return;
  }
  $('msg').textContent = data.projects.length ? '' : 'Проекты не найдены: добавьте vizor.json в корень проекта.';
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const names = data.projects.map((p) => p.name);
  if (!names.includes(current)) current = [fromHash, loadPref('project', null)].find((n) => names.includes(n)) || names[0];
  if (servicesParam && current) {
    const p = data.projects.find((x) => x.name === current);
    hiddenServices[current] = p.services.map((s) => s.id).filter((id) => !servicesParam.includes(id));
    servicesParam = null;
  }
  if (current) show();
  $('updated').textContent = 'обновлено ' + new Date(data.builtAt).toLocaleTimeString();
}

/* ---------- цикл отрисовки ---------- */

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  stepFades(performance.now());
  if (flight) {
    flight.t = Math.min(1, flight.t + dt * 1.4);
    const k = 1 - Math.pow(1 - flight.t, 3);
    controls.target.lerpVectors(flight.fromT, flight.toT, k);
    camera.position.lerpVectors(flight.fromP, flight.toP, k);
    if (flight.t >= 1) flight = null;
  }
  controls.update();
  if (view) {
    for (const p of view.particles) {
      p.t = (p.t + dt * 0.25) % 1;
      p.dot.position.copy(p.curve.getPoint(p.back ? 1 - p.t : p.t));
    }
    const pulse = (Math.sin(performance.now() / 300) + 1) / 2;
    const alarm = (Math.sin(performance.now() / 420) + 1) / 2;   // свой ритм, чтобы не сливался с «недавно изменён»
    const glow = (Math.sin(performance.now() / 650) + 1) / 2;
    for (const r of view.edges) if (r.glow) r.glow.material.opacity = 0.12 + glow * 0.16;
    // подпись видна, когда ячейка блока на экране шире ~55 px
    const pxPerUnitAt1 = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    for (const v of view.nodes.values()) {
      if (v.ring) { v.ring.scale.setScalar(1 + pulse * 0.35); v.ring.material.opacity = 0.9 - pulse * 0.6; }
      if (v.docRing) {
        // у открытого (увеличенного) блока красное свечение отодвигается наружу, за его собственную подсветку
        const grown = 1 + (v.mesh.scale.x - 1) * 0.45;
        v.docRing.scale.setScalar(v.docRing.userData.base * grown * (1 + alarm * 0.12));
        v.docRing.material.opacity = 0.6 - alarm * 0.35;
        // недавно изменённый остаётся жёлтым, остальные мягко краснеют в такт кольцу
        if (!v.recent) v.mesh.material.emissive.setRGB(0.42 * (1 - alarm), 0, 0);
      }
      // открытый блок растёт (основание остаётся на платформе) и светится — его легко найти на общей схеме
      const target = v.open ? OPEN_SCALE : 1, sc = v.mesh.scale.x;
      if (Math.abs(target - sc) > 1e-3) {
        const next = sc + (target - sc) * Math.min(1, dt * 8);
        v.mesh.scale.setScalar(next);
        v.mesh.position.y = (v.h / 2) * next;
      }
      if (v.open) {
        v.mesh.material.emissive.setHex((KINDS[v.n.kind] || KINDS.module).color).multiplyScalar(0.3 + glow * 0.35);
        v.openRing.scale.setScalar(1 + glow * 0.12);
        v.openRing.material.opacity = 1 - glow * 0.4;
      }
      // дальние подписи прячем, чтобы не было каши из текста
      const far = (CELL * pxPerUnitAt1) / camera.position.distanceTo(v.base) < 55;
      v.label.visible = !far || v.n.id === hovered || cards.has('node:' + v.n.id) || !!v.ring;
    }
    // подпись папки не шире своей плитки на экране
    for (const c of view.clusters) {
      const px = (c.w * pxPerUnitAt1) / camera.position.distanceTo(c.label.getWorldPosition(tmp));
      c.label.element.style.maxWidth = Math.max(0, px - 6) + 'px';
      c.label.visible = px > 28;
    }
  }
  updateCards();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// доступ к состоянию схемы из консоли браузера — для отладки и автопроверок
window.vizorDebug = { get view() { return view; }, get hoverGroup() { return hoverGroup; }, get drag() { return drag; }, get camera() { return camera; }, get cards() { return [...cards.values()]; }, openNode: (id) => focusNode(id), builds: 0 };

applyControls();
pollArchitecture();
pollStatus();
setInterval(pollArchitecture, 4000);
setInterval(pollStatus, 5000);
setInterval(updateRecent, 30000);
</script>
