<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizor · архитектура</title>
<style>
  :root {
    --bg: #0d1016; --panel: rgba(22, 27, 36, .92); --text: #e6e9ef; --muted: #8b95a7; --border: #2b3240;
    --ok: #3ecf7d; --bad: #f0605d; --accent: #4f8cff; --recent: #ffe066;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           backdrop-filter: blur(6px); z-index: 10; }
  #top { top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px 14px; padding: 8px 12px; flex-wrap: wrap; }
  #top h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .group .cap { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .chip { padding: 4px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { padding: 4px 12px; border: 0; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .layer { padding: 4px 10px 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: transparent; display: inline-flex; gap: 7px; align-items: center; opacity: .55; }
  .layer .box { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--c); display: grid; place-items: center; font-size: 10px; line-height: 1; color: #0d1016; }
  .layer[aria-pressed="true"] { opacity: 1; border-color: var(--c); }
  .layer[aria-pressed="true"] .box { background: var(--c); }
  .layer[aria-pressed="true"] .box::after { content: "✓"; font-weight: 700; }
  .layer .n { color: var(--muted); font-size: 12px; }
  #top .meta { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #top .meta a { color: var(--text); }
  #home { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; }

  #legend { left: 12px; bottom: 12px; padding: 10px 14px; font-size: 12px; max-width: 300px; }
  #legend h2, #recent h2 { font-size: 12px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #legend ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
  #legend li { display: flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .ln { width: 18px; height: 3px; border-radius: 2px; flex: none; }
  .ln.dash { background: repeating-linear-gradient(90deg, #c0c8d8 0 4px, transparent 4px 7px) !important; }
  #legend .hint { color: var(--muted); margin: 6px 0 0; }
  #legend summary { cursor: pointer; color: var(--muted); }

  #recent { right: 12px; bottom: 12px; padding: 0; font-size: 12px; width: 260px; overflow: hidden; }
  /* шапка-кнопка сворачивает список: тело схлопывается по высоте, окно остаётся прижатым к низу */
  #recent .head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: none; border: 0; text-align: left; }
  #recent .head .ttl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #recent .head .count { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 600; min-width: 18px; text-align: center;
                         padding: 1px 6px; border-radius: 8px; border: 1px solid var(--border); }
  #recent .head .count.has { color: var(--recent); border-color: var(--recent); }
  #recent .head svg { flex: none; color: var(--muted); transition: transform .3s ease; }
  #recent .head:hover svg { color: var(--text); }
  #recent.collapsed .head svg { transform: rotate(180deg); }
  #recent .body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
  #recent.collapsed .body { grid-template-rows: 0fr; }
  #recent .body > div { min-height: 0; overflow: hidden; }
  #recent ul { list-style: none; margin: 0; padding: 0 14px 10px; max-height: calc(40vh - 40px); overflow: auto; }
  #recent li button { width: 100%; text-align: left; background: none; border: 0; padding: 3px 0; display: flex; gap: 8px; }
  #recent li button:hover .name { color: var(--recent); }
  #recent .ago { color: var(--muted); margin-left: auto; white-space: nowrap; }
  #recent .empty { color: var(--muted); }

  #info { top: 110px; right: 12px; width: 320px; max-height: calc(100vh - 110px - 40vh - 36px); overflow: auto; padding: 14px 16px; display: none; transition: max-height .3s ease; }
  #recent.collapsed ~ #info { max-height: calc(100vh - 110px - 70px); }
  #info.open { display: block; }
  #info h3 { margin: 0 32px 2px 0; font-size: 16px; overflow-wrap: anywhere; }
  #info .kind { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #info .close { position: absolute; top: 8px; right: 8px; background: none; border: 0; font-size: 18px; color: var(--muted); }
  #info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  #info dt { color: var(--muted); } #info dd { margin: 0; overflow-wrap: anywhere; }
  #info h4 { margin: 12px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  #info ul { list-style: none; margin: 0; padding: 0; }
  #info li button { background: none; border: 0; padding: 2px 0; text-align: left; display: flex; gap: 8px; align-items: center; }
  #info li button:hover { color: var(--recent); }
  #info .rel { color: var(--muted); font-size: 11px; }
  #info ul.api li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; font-size: 13px; }
  #info ul.api a { color: #9cc0ff; font-weight: 600; }
  .method { font: 700 11px/1 ui-monospace, Consolas, monospace; padding: 4px 6px; border-radius: 5px; color: #0d1016; background: #9aa3b2; flex: none; margin-top: 1px; }
  .m-get { background: #61affe; } .m-post { background: #49cc90; } .m-put { background: #fca130; } .m-patch { background: #50e3c2; } .m-delete { background: #f93e3e; }

  /* подписи в сцене */
  .lbl { font-size: 11px; color: #cfd6e2; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 2px #000; padding-top: 4px; transition: opacity .3s ease; }
  .lbl.recent { color: var(--recent); font-weight: 600; }
  .lbl.hl { color: #fff; font-weight: 600; font-size: 12px; }
  .cl { overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #9fb0c9; white-space: nowrap; text-shadow: 0 1px 3px #000; letter-spacing: .03em; }
  .svc { font-size: 14px; font-weight: 600; white-space: nowrap; padding: 3px 10px; border-radius: 8px; background: rgba(13,16,22,.8);
         border: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .svc .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .svc.up .dot { background: var(--ok); } .svc.down .dot { background: var(--bad); }
  .svc .st { font-weight: 400; color: var(--muted); font-size: 12px; }
  .floor { font-size: 20px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; opacity: .85; text-shadow: 0 2px 6px #000; text-align: right; }
  .floor small { display: block; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  /* под «ФРОНТЕНД» — ссылки на видимые фронтенды */
  .floor .sites { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 6px; pointer-events: auto; }
  .floor .sites a { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--text); text-decoration: none; display: inline-flex; gap: 8px; align-items: baseline;
                    padding: 2px 8px; border-radius: 7px; background: rgba(13, 16, 22, .88); border: 1px solid var(--border); text-shadow: none; }
  .floor .sites a:hover { border-color: #9cc0ff; }
  .floor .sites a small { display: inline; font-weight: 400; color: var(--muted); }
  .floor .sites a:hover { color: #9cc0ff; } .floor .sites a:hover small { color: #9cc0ff; }
  .floor.empty { opacity: .45; }

  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  @media (max-width: 760px) {
    #legend { display: none; }
    #info { left: 12px; width: auto; }
    #recent { left: 12px; width: auto; }
    #recent ul { max-height: calc(25vh - 40px); }
  }
</style>
<script type="importmap">

</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="msg">загрузка…</div>

<header id="top" class="panel">
  <h1>Vizor</h1>
  <nav id="tabs" class="group" aria-label="Проекты"></nav>
  <div class="seg" role="group" aria-label="Вид">
    <button data-mode="2d">2D</button><button data-mode="3d">3D</button>
  </div>
  <div id="layers" class="group" role="group" aria-label="Слои"><span class="cap">Слои:</span></div>
  <div id="services" class="group" role="group" aria-label="Сервисы"><span class="cap">Сервисы:</span></div>
  <span class="meta">
    <span id="updated">—</span>
    <button id="home">Общий вид</button>
    <a href="/status">Статус сервисов</a>
  </span>
</header>

<aside id="legend" class="panel">
  <details open>
    <summary>Как читать схему</summary>
    <h2 style="margin-top:8px">Блоки</h2>
    <ul id="kinds"></ul>
    <h2>Связи</h2>
    <ul id="edgekinds"></ul>
    <p class="hint" id="hint"></p>
  </details>
</aside>

<aside id="recent" class="panel">
  <button class="head" id="recentToggle" aria-expanded="true" aria-controls="recentBody" title="Свернуть или развернуть">
    <span class="ttl">Недавно изменено</span>
    <span class="count" id="recentCount">0</span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="body" id="recentBody"><div>
    <ul id="recentList"><li class="empty">пока ничего</li></ul>
  </div></div>
</aside>

<aside id="info" class="panel" aria-live="polite"></aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (id) => document.getElementById(id);

/* ---------- словарь: что значит каждый блок, связь и слой ---------- */

const KINDS = {
  page:      { name: 'Страница / экран',      color: 0x4f8cff, shape: 'tall' },
  component: { name: 'Компонент интерфейса',  color: 0x39c0ff, shape: 'cube' },
  unit:      { name: 'Компонент библиотеки',  color: 0xa879ff, shape: 'cube' },
  store:     { name: 'Хранилище состояния',   color: 0xff7ab6, shape: 'cyl' },
  module:    { name: 'Модуль с логикой',      color: 0xf5b544, shape: 'ball' },
  entry:     { name: 'Обработчик запросов',   color: 0xff9f43, shape: 'tall' },
  route:     { name: 'Адрес API',             color: 0xffd166, shape: 'cone' },
  table:     { name: 'Таблица базы данных',   color: 0xe98a4f, shape: 'cyl' },
  style:     { name: 'Стили',                 color: 0x6fd3c1, shape: 'flat' },
  data:      { name: 'Данные / описание',     color: 0x8a94a6, shape: 'flat' },
  config:    { name: 'Настройки сборки',      color: 0x5b6475, shape: 'flat' },
};
const EDGES = {
  import:  { name: 'подключает файл',            color: 0x6d86b8, out: 'Подключает', in: 'Подключается в' },
  route:   { name: 'адрес API → обработчик',      color: 0xffd166, out: 'Обрабатывается в', in: 'Обрабатывает адрес' },
  api:     { name: 'запрос к API',               color: 0xffd166, out: 'Запрашивает', in: 'Запрашивается из' },
  db:      { name: 'работа с таблицей',          color: 0xe98a4f, out: 'Работает с таблицей', in: 'Используется в' },
  via:     { name: 'через скрытые слои',         color: 0xc0c8d8, out: 'Связан через скрытые слои', in: 'Связан через скрытые слои' },
  service: { name: 'связь сервисов',             color: 0x9aa3b2, out: 'Связан с', in: 'Связан с' },
};
// Этажи сверху вниз. Каждый блок попадает на этаж по своему виду (см. floorOf)
const FLOORS = [
  { key: 'frontend', title: 'ФРОНТЕНД',     short: 'Фронтенд',       sub: 'то, что видит пользователь',            color: 0x4f8cff },
  { key: 'api',      title: 'БЭКЕНД / API', short: 'Бэкенд / API',   sub: 'сервер и адреса, по которым к нему ходят', color: 0xff9f43 },
  { key: 'logic',    title: 'БИЗНЕС-ЛОГИКА', short: 'Бизнес-логика', sub: 'правила и расчёты без интерфейса',       color: 0xc77dff },
  { key: 'db',       title: 'БАЗА ДАННЫХ',  short: 'База данных',    sub: 'где хранятся данные',                    color: 0xe98a4f },
];
const FLOOR_BY_KIND = { page: 'frontend', component: 'frontend', unit: 'frontend', style: 'frontend',
                        route: 'api', entry: 'api', module: 'logic', store: 'logic', table: 'db' };
function floorOf(n) {
  if (FLOOR_BY_KIND[n.kind]) return FLOOR_BY_KIND[n.kind];
  return n.layer === 'frontend' ? 'frontend' : n.layer === 'db' ? 'db' : 'api';   // данные и настройки — к своему сервису
}

const RECENT_MS = 15 * 60 * 1000;
const hex = (c) => '#' + c.toString(16).padStart(6, '0');

for (const k of Object.values(KINDS)) $('kinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:${hex(k.color)}"></span>${k.name}</li>`);
for (const [key, e] of Object.entries(EDGES)) {
  $('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="ln${key === 'via' ? ' dash' : ''}" style="background:${hex(e.color)}"></span>${e.name}</li>`);
}
$('edgekinds').insertAdjacentHTML('beforeend', `<li><span class="sw" style="background:var(--recent);border-radius:50%"></span>изменён за 15 мин</li>`);

/* ---------- настройки вида (запоминаются в браузере) ---------- */

function loadPref(key, def) { try { return JSON.parse(localStorage.getItem('vizor.' + key)) ?? def; } catch { return def; } }
function savePref(key, val) { try { localStorage.setItem('vizor.' + key, JSON.stringify(val)); } catch { /* недоступно */ } }

let mode = loadPref('mode', '3d');
let shown = new Set(loadPref('layers', FLOORS.map((f) => f.key)).filter((k) => FLOORS.some((f) => f.key === k)));
// адрес может задать вид явно: /?mode=2d&layers=frontend,db#проект
const params = new URLSearchParams(location.search);
if (['2d', '3d'].includes(params.get('mode'))) mode = params.get('mode');
if (params.get('layers')) shown = new Set(params.get('layers').split(',').filter((k) => FLOORS.some((f) => f.key === k)));
if (!shown.size) shown = new Set(FLOORS.map((f) => f.key));

// скрытые сервисы хранятся по проектам: { проект: [id, …] }; новый сервис по умолчанию виден
const hiddenServices = loadPref('hiddenServices', {});
let servicesParam = params.get('services') ? params.get('services').split(',') : null;   // /?services=showcase — показать только эти
const hiddenSvc = () => new Set(hiddenServices[current] || []);

/* ---------- сцена ---------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('scene').append(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('labels') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1016);
scene.fog = new THREE.Fog(0x0d1016, 120, 320);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(40, 38, 70);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;
controls.maxDistance = 600;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30, 60, 40);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-40, -20, -30);
scene.add(fill);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function label(cls, html) {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  return new CSS2DObject(div);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- состояние ---------- */

let data = null, signature = '', current = null;
let world = null;          // THREE.Group текущего проекта
let view = null;           // узлы, рёбра, платформы и бегущие точки текущей сцены
let hovered = null, selected = null;
let status = {};

/* ---------- раскладка ---------- */

const CELL = 3.4;

// Узлы платформы группируются по папкам; папки укладываются «полками»
function layoutPlatform(nodes) {
  const clusters = new Map();
  for (const n of nodes) (clusters.get(n.cluster) || clusters.set(n.cluster, []).get(n.cluster)).push(n);
  const boxes = [...clusters.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([name, list]) => {
    list.sort((a, b) => a.kind.localeCompare(b.kind) || a.label.localeCompare(b.label));
    const cols = Math.ceil(Math.sqrt(list.length * 1.6));
    const rows = Math.ceil(list.length / cols);
    return { name, list, cols, rows, w: cols * CELL, d: rows * CELL + 1.6 };
  });
  const area = boxes.reduce((s, b) => s + (b.w + 2) * (b.d + 2), 0);
  const maxW = Math.max(14, Math.sqrt(area) * 1.5);
  let x = 0, z = 0, rowD = 0, width = 0;
  for (const b of boxes) {
    if (x > 0 && x + b.w > maxW) { x = 0; z += rowD + 2; rowD = 0; }
    b.x = x; b.z = z;
    x += b.w + 2; rowD = Math.max(rowD, b.d); width = Math.max(width, x - 2);
  }
  const depth = z + rowD;
  const pos = new Map();
  for (const b of boxes) {
    b.list.forEach((n, i) => {
      pos.set(n.id, { x: b.x + (i % b.cols) * CELL + CELL / 2 - width / 2, z: b.z + 1.6 + Math.floor(i / b.cols) * CELL + CELL / 2 - depth / 2 });
    });
    b.cx = b.x - width / 2; b.cz = b.z - depth / 2;
  }
  return { boxes, pos, width: Math.max(width, 8), depth: Math.max(depth, 6) };
}

/* ---------- построение ---------- */

function geometryFor(shape) {
  switch (shape) {
    case 'tall': return new THREE.BoxGeometry(1.6, 2.6, 1.6);
    case 'cyl':  return new THREE.CylinderGeometry(0.95, 0.95, 1.6, 24);
    case 'ball': return new THREE.SphereGeometry(0.95, 24, 16);
    case 'cone': return new THREE.ConeGeometry(0.85, 1.8, 4);
    case 'flat': return new THREE.BoxGeometry(1.5, 0.5, 1.5);
    default:     return new THREE.BoxGeometry(1.6, 1.6, 1.6);
  }
}
const GEOMS = Object.fromEntries(['tall', 'cyl', 'ball', 'cone', 'flat', 'cube'].map((s) => [s, geometryFor(s)]));
const HEIGHT = { tall: 2.6, cyl: 1.6, ball: 1.9, cone: 1.8, flat: 0.5, cube: 1.6 };

function disposeWorld() {
  if (!world) return;
  fades.clear();
  world.traverse((o) => {
    if (o.isCSS2DObject) o.element.remove();
    if (o.geometry && !Object.values(GEOMS).includes(o.geometry)) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(world);
  world = null;
}

// Каждый этаж строится в своей группе как горизонтальная плоскость.
// В 2D группа поворачивается на 90° к зрителю: глубина становится высотой на экране.
function build(project) {
  disposeWorld();
  world = new THREE.Group();
  scene.add(world);
  view = { nodes: new Map(), edges: [], platforms: [], clusters: [], particles: [], hidden: 0 };

  const floors = FLOORS.filter((f) => shown.has(f.key));
  const offSvc = hiddenSvc();
  const visible = project.nodes.filter((n) => shown.has(floorOf(n)) && !offSvc.has(n.service));
  view.hidden = project.nodes.length - visible.length;

  // платформы: сервис × этаж; сервис без единого файла — пустая платформа на этаже своего типа
  const hasNodes = new Set(project.nodes.map((n) => n.service));
  const plats = floors.map((f) => {
    const list = project.services
      .filter((s) => !offSvc.has(s.id))
      .map((s) => ({ s, nodes: visible.filter((n) => n.service === s.id && floorOf(n) === f.key) }))
      .filter((p) => p.nodes.length || (!hasNodes.has(p.s.id) && floorOf({ layer: p.s.layer }) === f.key));
    for (const p of list) p.L = layoutPlatform(p.nodes);
    const offOnly = !list.length && project.nodes.some((n) => floorOf(n) === f.key);
    return { f, list, offOnly, width: list.reduce((sum, p) => sum + p.L.width + 6, -6), depth: Math.max(18, ...list.map((p) => p.L.depth + 10)) };
  });
  const span = Math.max(30, ...plats.map((p) => p.width + 16));

  // высота этажей: в 3D — равный шаг, в 2D — полосы друг под другом
  const gap3d = Math.min(36, Math.max(14, span * 0.28));
  let y2d = 0;
  plats.forEach((fp, i) => {
    if (mode === '3d') fp.y = -i * gap3d;
    else { fp.y = y2d - fp.depth / 2; y2d -= fp.depth + 6; }
  });

  for (const fp of plats) {
    const g = new THREE.Group();
    g.position.y = fp.y;
    if (mode === '2d') g.rotation.x = Math.PI / 2;
    world.add(g);
    buildFloor(g, fp, span);
    let x = -fp.width / 2;
    for (const p of fp.list) {
      const cx = x + p.L.width / 2;
      x += p.L.width + 6;
      buildPlatform(g, fp.f, p.s, p.L, cx);
    }
  }
  world.updateMatrixWorld(true);
  for (const v of view.nodes.values()) {
    v.base = v.group.localToWorld(v.localBase.clone());
    v.anchor = v.group.localToWorld(mode === '3d' ? v.localTop.clone() : v.localBase.clone().setY(v.localTop.y + 0.4));
  }
  for (const pl of view.platforms) pl.center = pl.group.localToWorld(pl.localCenter.clone());

  buildEdges(project, visible);
}

function buildFloor(g, fp, span) {
  const f = fp.f;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(span, fp.depth),
    new THREE.MeshBasicMaterial({ color: f.color, transparent: true, opacity: fp.list.length ? 0.06 : 0.025, side: THREE.DoubleSide, depthWrite: false }),
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -0.3;
  g.add(plane);
  const border = new THREE.LineSegments(new THREE.EdgesGeometry(plane.geometry), new THREE.LineBasicMaterial({ color: f.color, transparent: true, opacity: 0.4 }));
  border.rotation.x = -Math.PI / 2;
  border.position.y = -0.3;
  g.add(border);
  const fl = label('floor' + (fp.list.length ? '' : ' empty'), `<span style="color:${hex(f.color)}">${f.title}</span><small>${fp.list.length ? f.sub : fp.offOnly ? 'сервисы этого слоя скрыты' : 'в этом проекте нет'}</small>`);
  fl.position.set(-span / 2 - 1, 0, mode === '3d' ? 0 : -fp.depth / 2 + 3);
  fl.center.set(1, mode === '3d' ? 0.5 : 0);
  g.add(fl);
  // под «ФРОНТЕНД» — ссылки на фронтенды выбранных сервисов, под «БЭКЕНД / API» — на их Swagger
  const links = f.key === 'frontend'
    ? fp.list.filter((p) => /^https?:\/\//.test(p.s.url || '')).map(({ s }) => ({ id: s.id, url: s.url, note: s.url.replace(/^https?:\/\//, '') }))
    : f.key === 'api' ? fp.list.filter((p) => p.s.swagger).map(({ s }) => ({ id: s.id, url: s.swagger, note: 'Swagger' })) : [];
  if (links.length) {
    fl.element.insertAdjacentHTML('beforeend', '<div class="sites">' + links.map((l) =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="Открыть ${esc(l.url)}">${esc(l.id)} <small>${esc(l.note)} ↗</small></a>`).join('') + '</div>');
  }
}

function buildPlatform(g, f, s, L, cx) {
  const w = L.width + 3, d = L.depth + 3;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), new THREE.MeshStandardMaterial({ color: 0x1b2230, transparent: true, opacity: 0.85, roughness: 0.9 }));
  slab.position.set(cx, -0.2, 0);
  g.add(slab);
  const outline = new THREE.LineSegments(new THREE.EdgesGeometry(slab.geometry), new THREE.LineBasicMaterial({ color: 0x6b7587 }));
  outline.position.copy(slab.position);
  g.add(outline);
  const sl = label('svc', `<span class="dot"></span>${esc(s.id)} <span class="st">${esc(s.stack || '')}</span><span class="st state"></span>`);
  sl.position.set(cx, 0.2, -d / 2 - 0.5);
  sl.center.set(0.5, mode === '3d' ? 1 : 0);
  g.add(sl);
  if (!L.boxes.length) {
    const empty = label('cl', 'пока пустой');
    empty.position.set(cx, 0.05, 0);
    g.add(empty);
  }
  view.platforms.push({ service: s.id, floor: f.key, outline, label: sl, group: g, localCenter: new THREE.Vector3(cx, 0, 0) });

  // подписи папок
  for (const b of L.boxes) {
    if (!b.name && L.boxes.length === 1) continue;
    const tile = new THREE.Mesh(new THREE.PlaneGeometry(b.w + 0.6, b.d + 0.4), new THREE.MeshBasicMaterial({ color: 0x2a3446, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
    tile.rotation.x = -Math.PI / 2;
    tile.position.set(cx + b.cx + b.w / 2, 0.02, b.cz + b.d / 2);
    g.add(tile);
    // длинный путь укорачиваем до двух последних папок: «components/sphere/buttons» → «sphere/buttons»
    const cl = label('cl', esc(b.name ? b.name.split('/').slice(-2).join('/') : 'основные файлы'));
    cl.position.set(cx + b.cx + 0.2, 0.05, b.cz + 0.7);
    cl.center.set(0, 0.5);
    g.add(cl);
    view.clusters.push({ label: cl, w: b.w });
  }

  for (const n of L.boxes.flatMap((b) => b.list)) {
    const k = KINDS[n.kind] || KINDS.module;
    const p = L.pos.get(n.id);
    const h = HEIGHT[k.shape];
    const mesh = new THREE.Mesh(GEOMS[k.shape], new THREE.MeshStandardMaterial({ color: k.color, roughness: 0.45, metalness: 0.1, transparent: true, emissive: 0x000000 }));
    mesh.position.set(cx + p.x, h / 2, p.z);
    if (k.shape === 'cone') mesh.rotation.y = Math.PI / 4;
    mesh.userData.id = n.id;
    g.add(mesh);
    const lb = label('lbl', esc(n.label));
    // в 3D подпись под блоком на платформе, в 2D — под блоком на экране
    lb.position.set(0, mode === '3d' ? -h / 2 : 0, mode === '3d' ? 0 : 1.1);
    lb.center.set(0.5, 0);
    mesh.add(lb);
    view.nodes.set(n.id, { n, floor: f.key, mesh, label: lb, group: g, localBase: new THREE.Vector3(cx + p.x, 0, p.z), localTop: new THREE.Vector3(cx + p.x, h, p.z), ring: null, out: [], in: [] });
  }
}

/* ---------- связи ---------- */

function curveBetween(a, b, kind) {
  if (kind === 'service') {
    const mid = a.center.clone().add(b.center).multiplyScalar(0.5);
    if (mode === '3d') mid.z -= 10; else mid.x += 10;
    return new THREE.QuadraticBezierCurve3(a.center.clone(), mid, b.center.clone());
  }
  const start = a.anchor.clone(), end = b.anchor.clone();
  const mid = start.clone().add(end).multiplyScalar(0.5);
  const dist = start.distanceTo(end);
  const lift = Math.min(10, 1.2 + dist * 0.28);
  if (mode === '3d') {
    if (a.floor === b.floor) mid.y += lift;
    else { mid.x += (end.x - start.x) * 0.1; mid.z += 4; }
  } else {
    // в плоскости дугу выгибаем вбок от прямой
    const d = end.clone().sub(start);
    const side = new THREE.Vector3(-d.y, d.x, 0).normalize();
    mid.addScaledVector(side, a.floor === b.floor ? lift * 0.6 : Math.min(6, dist * 0.12));
  }
  return new THREE.QuadraticBezierCurve3(start, mid, end);
}

function addEdgeObject(e, a, b) {
  const meta = EDGES[e.kind] || EDGES.import;
  const curve = curveBetween(a, b, e.kind);
  let obj;
  if (e.kind === 'via') {
    obj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)), new THREE.LineDashedMaterial({ color: meta.color, dashSize: 0.8, gapSize: 0.5, transparent: true, opacity: 0.8 }));
    obj.computeLineDistances();
  } else if (e.kind === 'import' || e.kind === 'route') {
    obj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)), new THREE.LineBasicMaterial({ color: meta.color, transparent: true, opacity: e.kind === 'route' ? 0.7 : 0.35 }));
  } else {
    obj = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, e.kind === 'service' ? 0.18 : 0.09, 6), new THREE.MeshBasicMaterial({ color: meta.color, transparent: true, opacity: 0.75 }));
  }
  if (e.kind === 'api' || e.kind === 'db' || e.kind === 'service') {
    // бегущие точки показывают направление запроса
    for (let i = 0; i < 3; i++) {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(e.kind === 'service' ? 0.35 : 0.22, 10, 8), new THREE.MeshBasicMaterial({ color: meta.color, transparent: true }));
      world.add(dot);
      view.particles.push({ dot, curve, t: i / 3, edge: e });
    }
  }
  world.add(obj);
  view.edges.push({ e, obj, base: obj.material.opacity });
}

// Связи между видимыми блоками. Если путь идёт через скрытые слои (например фронтенд → API → логика → таблица,
// а показаны только фронтенд и база), рисуется пунктирная связь «через скрытые слои».
function buildEdges(project, visible) {
  const vis = new Set(visible.map((n) => n.id));
  const byId = new Map(project.nodes.map((n) => [n.id, n]));
  const out = new Map();
  for (const e of project.edges) (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);

  const keys = new Set();
  const add = (e) => {
    const a = view.nodes.get(e.from), b = view.nodes.get(e.to);
    const key = e.from + '>' + e.to;
    if (!a || !b || keys.has(key)) return;
    keys.add(key);
    addEdgeObject(e, a, b);
    a.out.push(e); b.in.push(e);
  };
  for (const e of project.edges) if (vis.has(e.from) && vis.has(e.to)) add(e);

  if (view.hidden) {
    for (const src of vis) {
      // обход только по скрытым блокам, пока не дойдём до видимого
      const seen = new Set([src]);
      const queue = (out.get(src) || []).filter((e) => !vis.has(e.to)).map((e) => ({ id: e.to, via: [e.to] }));
      while (queue.length) {
        const { id, via } = queue.shift();
        if (seen.has(id)) continue;
        seen.add(id);
        if (vis.has(id)) {
          // скрытый блок назван по причине: выключен его сервис или его слой
          const offSvc = hiddenSvc();
          const why = (h) => { const n = byId.get(h); return offSvc.has(n.service) ? `сервис ${n.service}` : FLOORS.find((f) => f.key === floorOf(n)).short; };
          const floors = [...new Set(via.slice(0, -1).map(why))];
          add({ from: src, to: id, kind: 'via', label: 'через: ' + floors.join(', '), path: via.slice(0, -1).map((h) => byId.get(h).label) });
          continue;
        }
        if (via.length > 8) continue;
        for (const e of out.get(id) || []) if (!seen.has(e.to)) queue.push({ id: e.to, via: [...via, e.to] });
      }
    }
  }

  // когда связей много, подключения и обходные связи бледнее; связи блока под курсором всё равно подсвечиваются
  if (view.edges.length > 80) {
    for (const r of view.edges) if (r.e.kind === 'import' || r.e.kind === 'via') r.obj.material.opacity = r.base = r.e.kind === 'via' ? 0.2 : 0.16;
  }

  // связи из vizor.json между сервисами, у которых не нашлось связей на уровне файлов
  const svcOf = (id) => byId.get(id)?.service;
  for (const l of project.links) {
    const found = project.edges.some((e) => svcOf(e.from) === l.from && svcOf(e.to) === l.to && e.kind !== 'import');
    const a = view.platforms.find((p) => p.service === l.from), b = view.platforms.find((p) => p.service === l.to);
    if (found || !a || !b || l.from === l.to) continue;
    addEdgeObject({ kind: 'service', from: l.from, to: l.to, label: l.label }, a, b);
  }
}

/* ---------- камера ---------- */

function applyControls() {
  controls.enableRotate = mode === '3d';
  controls.mouseButtons = mode === '3d'
    ? { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN }
    : { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  $('hint').textContent = mode === '3d'
    ? 'Тяните мышью — вращать, колесо — приблизить, правая кнопка — сдвинуть. Клик по блоку — подробности и связи.'
    : 'Тяните мышью — сдвинуть, колесо — приблизить. Клик по блоку — подробности и связи.';
}

function fitCamera() {
  if (!world) return;
  const box = new THREE.Box3().setFromObject(world);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  let pos, r;
  if (mode === '3d') {
    r = Math.max(size.x, size.y * 1.4, size.z) * 0.8 + 10;
    pos = new THREE.Vector3(center.x + r * 0.45, center.y + r * 0.55, center.z + r * 1.05);
  } else {
    const fov = THREE.MathUtils.degToRad(camera.fov);
    r = (Math.max(size.y, size.x / camera.aspect) / 2 / Math.tan(fov / 2)) * 1.12 + 6;
    pos = new THREE.Vector3(center.x, center.y, center.z + r);
  }
  scene.fog.near = r * 1.6;
  scene.fog.far = r * 4;
  flyTo(center, pos);
}

let flight = null;
function flyTo(target, position) {
  flight = { t: 0, fromT: controls.target.clone(), toT: target.clone(), fromP: camera.position.clone(), toP: position.clone() };
}
function focusNode(id) {
  const v = view?.nodes.get(id);
  if (!v) return;
  const dir = mode === '3d' ? camera.position.clone().sub(controls.target).normalize() : new THREE.Vector3(0, 0, 1);
  flyTo(v.base, v.base.clone().add(dir.multiplyScalar(26)));
  select(id);
}

/* ---------- подсветка и подробности ---------- */

function neighbours(id) {
  const set = new Set([id]);
  const v = view.nodes.get(id);
  if (!v) return set;
  v.out.forEach((e) => set.add(e.to));
  v.in.forEach((e) => set.add(e.from));
  return set;
}

// Подсветка меняется плавно: прозрачность материалов доводится до цели за FADE_MS (подписи — CSS-переходом той же длины)
const FADE_MS = 300;
const fades = new Map();   // материал → { from, to, t0 }
function fadeTo(mat, to) {
  const f = fades.get(mat);
  if ((f ? f.to : mat.opacity) === to) return;
  fades.set(mat, { from: mat.opacity, to, t0: performance.now() });
}
function stepFades(now) {
  for (const [mat, f] of fades) {
    const t = Math.min(1, (now - f.t0) / FADE_MS);
    const k = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease-in-out
    mat.opacity = f.from + (f.to - f.from) * k;
    if (t >= 1) fades.delete(mat);
  }
}

function applyHighlight() {
  if (!view) return;
  const focus = hovered || selected;
  const near = focus ? neighbours(focus) : null;
  for (const [id, v] of view.nodes) {
    const on = !near || near.has(id);
    fadeTo(v.mesh.material, on ? 1 : 0.15);
    v.label.element.style.opacity = on ? '' : '0.15';
    v.label.element.classList.toggle('hl', id === focus);
  }
  for (const r of view.edges) {
    const on = !focus || r.e.from === focus || r.e.to === focus;
    fadeTo(r.obj.material, on ? (focus ? 1 : r.base) : 0.04);
  }
  for (const p of view.particles) fadeTo(p.dot.material, !focus || p.edge.from === focus || p.edge.to === focus ? 1 : 0);
}

function ago(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) return `${Math.round(s / 60)} мин назад`;
  if (s < 86400) return `${Math.round(s / 3600)} ч назад`;
  return new Date(ms).toLocaleDateString();
}

function select(id) {
  selected = id;
  applyHighlight();
  const box = $('info');
  const v = id && view.nodes.get(id);
  if (!v) { box.classList.remove('open'); return; }
  const n = v.n, k = KINDS[n.kind] || KINDS.module;
  const svc = data.projects.find((p) => p.name === current).services.find((s) => s.id === n.service);
  const item = (otherId, e) => {
    const o = view.nodes.get(otherId)?.n;
    if (!o) return '';
    const rel = e.kind === 'via' ? `${e.label} (${e.path.join(' → ')})` : e.label || '';
    return `<li><button data-go="${esc(otherId)}"><span class="sw" style="background:${hex((KINDS[o.kind] || KINDS.module).color)}"></span>${esc(o.label)} <span class="rel">${esc(rel)}</span></button></li>`;
  };
  const groups = {};
  for (const e of v.out) (groups[EDGES[e.kind].out] ||= []).push(item(e.to, e));
  for (const e of v.in) (groups[EDGES[e.kind].in + (e.kind === 'via' ? ' (входящие)' : '')] ||= []).push(item(e.from, e));
  box.innerHTML = `
    <button class="close" aria-label="Закрыть">×</button>
    <h3>${esc(n.label)}</h3>
    <div class="kind"><span class="sw" style="display:inline-block;background:${hex(k.color)}"></span> ${k.name}</div>
    <dl>
      <dt>Слой</dt><dd>${FLOORS.find((f) => f.key === v.floor).short}</dd>
      <dt>Сервис</dt><dd>${esc(svc ? `${svc.id} (${svc.stack || svc.type})` : n.service)}</dd>
      <dt>Где лежит</dt><dd>${esc(n.path)}</dd>
      ${n.files.length > 1 ? `<dt>Файлов</dt><dd>${n.files.length}: ${n.files.map((f) => esc(f.split('/').pop())).join(', ')}</dd>` : ''}
      ${n.mtime ? `<dt>Изменён</dt><dd>${ago(n.mtime)}</dd>` : ''}
    </dl>
    ${n.api?.length ? `<h4>Описание в Swagger</h4><ul class="api">${n.api.map((a) => `<li>
      <span class="method m-${a.method.toLowerCase()}">${a.method}</span>
      <span>${esc(a.summary || a.operationId || '')}${a.docs ? `<br><a href="${esc(a.docs)}" target="_blank" rel="noopener noreferrer">Открыть в Swagger ↗</a>` : ''}</span></li>`).join('')}</ul>`
      : n.kind === 'route' ? '<h4>Описание в Swagger</h4><p class="rel">Этого адреса нет в openapi.json сервиса</p>' : ''}
    ${Object.entries(groups).map(([t, items]) => `<h4>${t} · ${items.length}</h4><ul>${items.join('')}</ul>`).join('') || '<h4>Связей с видимыми слоями нет</h4>'}`;
  box.classList.add('open');
}

$('info').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) focusNode(go.dataset.go);
  else if (ev.target.closest('.close')) select(null);
});
function setRecentCollapsed(on) {
  $('recent').classList.toggle('collapsed', on);
  $('recentToggle').setAttribute('aria-expanded', String(!on));
  savePref('recentCollapsed', on);
}
setRecentCollapsed(loadPref('recentCollapsed', false));
$('recentToggle').addEventListener('click', () => setRecentCollapsed(!$('recent').classList.contains('collapsed')));
$('recentList').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) focusNode(go.dataset.go);
});
$('home').onclick = () => { select(null); fitCamera(); };

const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
function pick(ev) {
  if (!view) return null;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects([...view.nodes.values()].map((v) => v.mesh), false)[0];
  return hit?.object.userData.id || null;
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const id = pick(ev);
  renderer.domElement.style.cursor = id ? 'pointer' : '';
  if (id !== hovered) { hovered = id; applyHighlight(); }
});
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  select(pick(ev));
});
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') select(null); });

/* ---------- недавние изменения ---------- */

function updateRecent() {
  if (!view) return;
  const now = Date.now();
  const list = [...view.nodes.values()].filter((v) => v.n.mtime && now - v.n.mtime < RECENT_MS).sort((a, b) => b.n.mtime - a.n.mtime);
  for (const v of view.nodes.values()) {
    const recent = list.includes(v);
    v.label.element.classList.toggle('recent', recent);
    if (recent && !v.ring) {
      v.ring = new THREE.Mesh(new THREE.RingGeometry(1.3, 1.55, 32), new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      v.ring.rotation.x = -Math.PI / 2;
      v.ring.position.copy(v.localBase).setY(0.06);
      v.group.add(v.ring);
    } else if (!recent && v.ring) {
      v.group.remove(v.ring); v.ring.geometry.dispose(); v.ring.material.dispose(); v.ring = null;
    }
    v.mesh.material.emissive.setHex(recent ? 0x5a4a00 : 0x000000);
  }
  $('recentCount').textContent = list.length;
  $('recentCount').classList.toggle('has', list.length > 0);
  $('recentList').innerHTML = list.length
    ? list.slice(0, 30).map((v) => `<li><button data-go="${esc(v.n.id)}"><span class="sw" style="background:${hex((KINDS[v.n.kind] || KINDS.module).color)}"></span><span class="name">${esc(v.n.label)}</span><span class="ago">${ago(v.n.mtime)}</span></button></li>`).join('')
    : '<li class="empty">за последние 15 минут ничего</li>';
}

/* ---------- статус сервисов ---------- */

function applyStatus() {
  if (!view) return;
  const p = status[current];
  for (const pl of view.platforms) {
    const s = p?.services.find((x) => x.id === pl.service);
    const state = !s || s.up === null ? '' : s.up ? 'up' : 'down';
    pl.outline.material.color.setHex(state === 'up' ? 0x3ecf7d : state === 'down' ? 0xf0605d : 0x6b7587);
    pl.label.element.className = 'svc ' + state;
    pl.label.element.querySelector('.state').textContent = !s ? '' : s.up === null ? '· пока пустой' : s.up ? '· работает' : '· не запущен';
  }
}

async function pollStatus() {
  try {
    const st = await (await fetch('/api/status', { cache: 'no-store' })).json();
    status = Object.fromEntries(st.projects.map((p) => [p.name, p]));
    applyStatus();
  } catch { /* vizor перезапускается */ }
}

/* ---------- панель: проекты, вид, слои ---------- */

function renderControls() {
  $('tabs').innerHTML = data.projects.map((p) => `<button class="chip" data-p="${esc(p.name)}" aria-pressed="${p.name === current}">${esc(p.name)}</button>`).join('');
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  const p = data.projects.find((x) => x.name === current);
  const off = hiddenSvc();
  const counts = Object.fromEntries(FLOORS.map((f) => [f.key, 0]));
  for (const n of p?.nodes || []) if (!off.has(n.service)) counts[floorOf(n)]++;
  const perSvc = {};
  for (const n of p?.nodes || []) perSvc[n.service] = (perSvc[n.service] || 0) + 1;
  $('services').innerHTML = '<span class="cap">Сервисы:</span>' + (p?.services || []).map((s) =>
    `<button class="layer" data-svc="${esc(s.id)}" aria-pressed="${!off.has(s.id)}" style="--c:#9aa3b2" title="${esc(s.stack || s.type)}">` +
    `<span class="box"></span>${esc(s.id)} <span class="n">${perSvc[s.id] || 0}</span></button>`).join('');
  $('layers').innerHTML = '<span class="cap">Слои:</span>' + FLOORS.map((f) =>
    `<button class="layer" data-layer="${f.key}" aria-pressed="${shown.has(f.key)}" style="--c:${hex(f.color)}" title="${f.sub}">` +
    `<span class="box"></span>${f.short} <span class="n">${counts[f.key]}</span></button>`).join('');
}

function rebuild(refit) {
  signature = '';
  hovered = null;
  show();
  if (refit) fitCamera();
}

$('tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-p]');
  if (!b || b.dataset.p === current) return;
  current = b.dataset.p;
  savePref('project', current);
  location.hash = encodeURIComponent(current);
  select(null);
  rebuild(true);
});
document.querySelector('.seg').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-mode]');
  if (!b || b.dataset.mode === mode) return;
  mode = b.dataset.mode;
  savePref('mode', mode);
  applyControls();
  rebuild(true);
});
$('services').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-svc]');
  if (!b) return;
  const p = data.projects.find((x) => x.name === current);
  const off = hiddenSvc();
  const id = b.dataset.svc;
  // последний видимый сервис не скрываем, иначе схема опустеет
  if (off.has(id)) off.delete(id); else if (p.services.length - off.size > 1) off.add(id);
  hiddenServices[current] = [...off];
  savePref('hiddenServices', hiddenServices);
  rebuild(true);
});
$('layers').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-layer]');
  if (!b) return;
  const k = b.dataset.layer;
  if (shown.has(k)) { if (shown.size > 1) shown.delete(k); } else shown.add(k);
  savePref('layers', [...shown]);
  rebuild(true);
});

/* ---------- данные архитектуры ---------- */

function show() {
  renderControls();
  const p = data.projects.find((x) => x.name === current);
  if (!p) return;
  // структура меняется → перестроить сцену; меняется только время правки → обновить подсветку
  const sig = current + JSON.stringify([p.services, p.links, p.nodes.map((n) => n.id + n.kind), p.edges.map((e) => e.from + '>' + e.to + e.kind)]);
  if (sig !== signature) {
    const first = !signature && !world;
    signature = sig;
    const keep = selected;
    build(p);
    if (keep && view.nodes.has(keep)) select(keep); else select(null);
    if (first) fitCamera();
  } else {
    for (const n of p.nodes) { const v = view.nodes.get(n.id); if (v) v.n = n; }
  }
  updateRecent();
  applyStatus();
  applyHighlight();
}

async function pollArchitecture() {
  try {
    data = await (await fetch('/api/architecture', { cache: 'no-store' })).json();
  } catch {
    $('updated').textContent = 'vizor недоступен';
    return;
  }
  $('msg').textContent = data.projects.length ? '' : 'Проекты не найдены: добавьте vizor.json в корень проекта.';
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const names = data.projects.map((p) => p.name);
  if (!names.includes(current)) current = [fromHash, loadPref('project', null)].find((n) => names.includes(n)) || names[0];
  if (servicesParam && current) {
    const p = data.projects.find((x) => x.name === current);
    hiddenServices[current] = p.services.map((s) => s.id).filter((id) => !servicesParam.includes(id));
    servicesParam = null;
  }
  if (current) show();
  $('updated').textContent = 'обновлено ' + new Date(data.builtAt).toLocaleTimeString();
}

/* ---------- цикл отрисовки ---------- */

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  stepFades(performance.now());
  if (flight) {
    flight.t = Math.min(1, flight.t + dt * 1.4);
    const k = 1 - Math.pow(1 - flight.t, 3);
    controls.target.lerpVectors(flight.fromT, flight.toT, k);
    camera.position.lerpVectors(flight.fromP, flight.toP, k);
    if (flight.t >= 1) flight = null;
  }
  controls.update();
  if (view) {
    for (const p of view.particles) {
      p.t = (p.t + dt * 0.25) % 1;
      p.dot.position.copy(p.curve.getPoint(p.t));
    }
    const pulse = (Math.sin(performance.now() / 300) + 1) / 2;
    // подпись видна, когда ячейка блока на экране шире ~55 px
    const pxPerUnitAt1 = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    for (const v of view.nodes.values()) {
      if (v.ring) { v.ring.scale.setScalar(1 + pulse * 0.35); v.ring.material.opacity = 0.9 - pulse * 0.6; }
      // дальние подписи прячем, чтобы не было каши из текста
      const far = (CELL * pxPerUnitAt1) / camera.position.distanceTo(v.base) < 55;
      v.label.visible = !far || v.n.id === hovered || v.n.id === selected || !!v.ring;
    }
    // подпись папки не шире своей плитки на экране
    for (const c of view.clusters) {
      const px = (c.w * pxPerUnitAt1) / camera.position.distanceTo(c.label.getWorldPosition(tmp));
      c.label.element.style.maxWidth = Math.max(0, px - 6) + 'px';
      c.label.visible = px > 28;
    }
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

applyControls();
pollArchitecture();
pollStatus();
setInterval(pollArchitecture, 4000);
setInterval(pollStatus, 5000);
setInterval(updateRecent, 30000);
</script>
</body>
</html>
